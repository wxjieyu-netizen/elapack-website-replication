<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" role="img" aria-label="Guide cover card: packaging fillers and void fill — choosing tissue, shredded paper and paper fillers by product">
<rect width="2400" height="1350" fill="#faf9f7"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#18120c">
<text x="130" y="155" font-size="45" font-weight="700" letter-spacing="9">ELAPACK · BUYER GUIDE</text>
<text x="130" y="340" font-size="120" font-weight="300">Fill the void, keep the reveal.</text>
<line x1="130" y1="415" x2="2270" y2="415" stroke="#b08d46" stroke-width="3"/>
<text x="130" y="535" font-size="48" fill="#b08d46">01</text><text x="300" y="535" font-size="50" font-weight="700">Choose</text>
<text x="780" y="535" font-size="44">Tissue, loose fill or pads, matched to the product inside</text>
<line x1="130" y1="610" x2="2270" y2="610" stroke="#ded9d2" stroke-width="2"/>
<text x="130" y="730" font-size="48" fill="#b08d46">02</text><text x="300" y="730" font-size="50" font-weight="700">Dose</text>
<text x="780" y="730" font-size="44">By void volume, then fixed by weight on a packed sample</text>
