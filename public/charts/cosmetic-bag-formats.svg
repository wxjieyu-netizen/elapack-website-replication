<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Table diagram mapping five cosmetic bag formats to their construction and the market that buys each">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">Cosmetic bag formats, structures and buyers</text>
  <rect x="90" y="120" width="240" height="72" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="110" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18120c" text-anchor="start" font-weight="bold">Zip pouch</text>
  <text x="110" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="start" font-weight="normal">Flat pouch, zip top</text>
  <text x="370" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b08d46" text-anchor="start" font-weight="normal">→</text>
  <text x="410" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">Retail &amp; promotional volume</text>
  <line x1="90" y1="202" x2="1110" y2="202" stroke="#e5d5b8" stroke-width="1"/>
  <rect x="90" y="212" width="240" height="72" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="110" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18120c" text-anchor="start" font-weight="bold">Dopp / toiletry case</text>
  <text x="110" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="start" font-weight="normal">Boxed, lined, zip or frame</text>
  <text x="370" y="242" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b08d46" text-anchor="start" font-weight="normal">→</text>
  <text x="410" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">Brand gift &amp; travel sets</text>
  <line x1="90" y1="294" x2="1110" y2="294" stroke="#e5d5b8" stroke-width="1"/>
  <rect x="90" y="304" width="240" height="72" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="110" y="334" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18120c" text-anchor="start" font-weight="bold">Clear PVC bag</text>
  <text x="110" y="356" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="start" font-weight="normal">Transparent, zip or press stud</text>
  <text x="370" y="334" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b08d46" text-anchor="start" font-weight="normal">→</text>
  <text x="410" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">Transparent travel-kit format</text>
  <line x1="90" y1="386" x2="1110" y2="386" stroke="#e5d5b8" stroke-width="1"/>
  <rect x="90" y="396" width="240" height="72" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="110" y="426" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18120c" text-anchor="start" font-weight="bold">Travel case</text>
  <text x="110" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="start" font-weight="normal">Structured, compartments</text>
  <text x="370" y="426" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b08d46" text-anchor="start" font-weight="normal">→</text>
  <text x="410" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">Retail travel lines</text>
  <line x1="90" y1="478" x2="1110" y2="478" stroke="#e5d5b8" stroke-width="1"/>
  <rect x="90" y="488" width="240" height="72" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="110" y="518" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18120c" text-anchor="start" font-weight="bold">Pouch set</text>
  <text x="110" y="540" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="start" font-weight="normal">2–5 nested pieces, one design</text>
  <text x="370" y="518" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b08d46" text-anchor="start" font-weight="normal">→</text>
  <text x="410" y="518" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">Gift &amp; subscription bundles</text>
  <line x1="90" y1="570" x2="1110" y2="570" stroke="#e5d5b8" stroke-width="1"/>
  <text x="600" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Standard shapes move at volume through retail channels — the custom buyer specifies fabric, lining, zip and print instead.</text>
</svg>
