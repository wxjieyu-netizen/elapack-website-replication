<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Count back a Christmas packaging order from the mid-November shelf date to the September enquiry">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Plan Christmas packaging by counting back from mid-November</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Custom Christmas boxes must be in the warehouse before mid-November — December is a month late for the season that pays for them</text>
<rect x="30.0" y="150" width="180.0" height="170" rx="6" fill="#18120c"/><text x="120.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">In the warehouse</text><text x="120.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">mid-November, before</text><text x="120.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">Black Friday (Nov 27) —</text><text x="120.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">the fixed anchor</text><line x1="216.0" y1="235.0" x2="258.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M264.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="270.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="360.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Freight on the water</text><text x="360.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">or in the air: 5–10 days</text><text x="360.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">by air, 4–6 weeks by sea</text><text x="360.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">as published — mode sets</text><line x1="456.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M504.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="510.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Production window</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">typically 15–20 days,</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">after sample approval</text><text x="600.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">and payment receipt</text><line x1="696.0" y1="235.0" x2="738.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M744.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="750.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="840.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Sample + approval</text><text x="840.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">3–5 days making — and</text><text x="840.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">in Q4, decisions turned</text><text x="840.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">around within 24 hours</text><line x1="936.0" y1="235.0" x2="978.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M984.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="990.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1080.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Enquiry + dieline</text><text x="1080.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">the second half of</text><text x="1080.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">September opens the</text><text x="1080.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">clean full-custom run</text>
<line x1="330" y1="345" x2="330" y2="385" stroke="#b08d46" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="330" cy="345" r="4" fill="#b08d46"/>
<text x="330" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#18120c">TODAY · late October</text>
<text x="330" y="430" text-anchor="middle" font-size="11.5" fill="#6b6258">the full-custom window is still open —</text>
<text x="330" y="447" text-anchor="middle" font-size="11.5" fill="#6b6258">it closes around early November</text>
<text x="60" y="640" font-size="11.5" fill="#6b6258">A Christmas order does not fail in December — it fails in October, when the enquiry that would have fit was never sent.</text>
</g>
</svg>
