<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Artwork zones on a paper shopping bag</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">Share artwork, colour reference and intended print area — then confirm the process on the chosen material</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="240" y="330" width="440" height="620" fill="white" stroke="#28251f" stroke-width="4"/><rect x="700" y="330" width="620" height="620" fill="#f1ece2" stroke="#28251f" stroke-width="4"/><rect x="1340" y="330" width="440" height="620" fill="white" stroke="#28251f" stroke-width="4"/><text x="1010" y="640" font-size="32" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">FRONT PANEL</text><text x="1010" y="690" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">primary print zone</text><text x="460" y="640" font-size="28" fill="#6f675a" font-family="Arial" text-anchor="middle">BACK PANEL</text><text x="1560" y="640" font-size="28" fill="#6f675a" font-family="Arial" text-anchor="middle">GUSSET / SIDE</text><text x="1560" y="690" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">seams limit edge print</text><rect x="920" y="420" width="180" height="120" fill="none" stroke="#aa8438" stroke-width="4" stroke-dasharray="10 8"/><text x="1010" y="395" font-size="24" fill="#aa8438" font-family="Arial" text-anchor="middle">spot logo option</text><rect x="760" y="760" width="500" height="130" fill="none" stroke="#aa8438" stroke-width="4" stroke-dasharray="10 8"/><text x="1010" y="930" font-size="24" fill="#aa8438" font-family="Arial" text-anchor="middle">flood / repeat-pattern option</text><rect x="1880" y="330" width="420" height="300" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1908" y="382" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Material first</text><text x="1908" y="430" font-size="28" fill="#28251f" font-family="Arial">A process suitable for a pouch is not</text><text x="1908" y="474" font-size="28" fill="#28251f" font-family="Arial">automatically suitable for a paper bag</text><text x="1908" y="518" font-size="28" fill="#28251f" font-family="Arial">— confirm the print or decoration</text><text x="1908" y="562" font-size="28" fill="#28251f" font-family="Arial">process on the selected material.</text><rect x="1880" y="660" width="420" height="300" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1908" y="712" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Review the sample</text><text x="1908" y="760" font-size="28" fill="#28251f" font-family="Arial">Check colour, rubbing or transfer on</text><text x="1908" y="804" font-size="28" fill="#28251f" font-family="Arial">the physical sample for the chosen</text><text x="1908" y="848" font-size="28" fill="#28251f" font-family="Arial">material and process.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>