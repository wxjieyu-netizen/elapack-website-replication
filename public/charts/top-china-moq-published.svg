<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Published MOQ ranges for seven of the ten suppliers in the top-China jewelry packaging shortlist, as published on their own websites: Richpack 100 to 500, Jialan 500 to 2000, Pakoro 5000, Winnerpak 500 to 1000, Ecoicolor 500 to 1000, Annaigee 200 to 500, ELAPACK 200">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="60" y="64" font-family="Georgia,serif" font-size="26" font-weight="600" fill="#18120c">Published MOQ figures, as published</text>
    <text x="60" y="90" font-size="14" fill="#6b6258">Each supplier's own website, checked 22 November 2026 — bases differ, so the figures are not directly comparable</text>

    <!-- scale: x = 250 + value * 0.14, max 5000 -> 950 -->

    <!-- Richpack 100-500 -->
    <text x="60" y="170" font-size="15" fill="#18120c">Richpack</text>
    <rect x="264" y="156" width="56" height="18" fill="#3d3227"/>
    <text x="332" y="170" font-size="14" fill="#6b6258">100–500 (selected styles to fully custom)</text>

    <!-- Jialan 500-2000 -->
    <text x="60" y="226" font-size="15" fill="#18120c">Jialan</text>
    <rect x="320" y="212" width="210" height="18" fill="#3d3227"/>
    <text x="542" y="226" font-size="14" fill="#6b6258">500–2,000 (its pages differ)</text>

    <!-- Pakoro 5000 point -->
    <text x="60" y="282" font-size="15" fill="#18120c">Pakoro</text>
    <rect x="943" y="268" width="14" height="18" fill="#3d3227"/>
    <text x="905" y="256" font-size="14" fill="#6b6258">5,000 per order</text>

    <!-- Winnerpak 500-1000 -->
    <text x="60" y="338" font-size="15" fill="#18120c">Winnerpak</text>
    <rect x="320" y="324" width="70" height="18" fill="#3d3227"/>
    <text x="402" y="338" font-size="14" fill="#6b6258">500–1,000 (FAQ vs its guide)</text>

    <!-- Ecoicolor 500-1000 -->
    <text x="60" y="394" font-size="15" fill="#18120c">Ecoicolor</text>
    <rect x="320" y="380" width="70" height="18" fill="#3d3227"/>
    <text x="402" y="394" font-size="14" fill="#6b6258">500–1,000 (sewn vs paper)</text>

    <!-- Annaigee 200-500 -->
    <text x="60" y="450" font-size="15" fill="#18120c">Annaigee</text>
    <rect x="278" y="436" width="42" height="18" fill="#3d3227"/>
    <text x="332" y="450" font-size="14" fill="#6b6258">200–500 (its pages differ)</text>

    <!-- ELAPACK 200 point, highlighted -->
    <text x="60" y="506" font-size="15" font-weight="600" fill="#18120c">ELAPACK</text>
    <rect x="271" y="492" width="14" height="18" fill="#b08d46"/>
    <text x="297" y="506" font-size="14" font-weight="600" fill="#18120c">200 per product or component</text>

    <line x1="250" y1="140" x2="250" y2="522" stroke="#d8cba9" stroke-width="1"/>
    <line x1="950" y1="140" x2="950" y2="522" stroke="#d8cba9" stroke-width="1"/>
    <text x="250" y="546" font-size="12" fill="#6b6258" text-anchor="middle">0</text>
    <text x="950" y="546" font-size="12" fill="#6b6258" text-anchor="middle">5,000 pieces</text>

    <text x="60" y="592" font-size="13" fill="#6b6258">Not charted: Haosung publishes a headline claim only (“MOQ 1pcs”, no product-level terms); ITIS and Huaisheng publish no MOQ figure.</text>
    <text x="60" y="616" font-size="13" fill="#6b6258">Ranges show where a supplier's own pages give different figures. Full terms in the table below.</text>
  </g>
</svg>
