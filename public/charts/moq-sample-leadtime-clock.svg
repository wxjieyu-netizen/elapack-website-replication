<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The three clocks a first order runs on">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">The three clocks a first order runs on</text>
<text x="60" y="78" font-size="13" fill="#6b6258">ELAPACK confirmed 2026 terms for standard orders: the MOQ line, the sample clock and the production clock</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">MOQ 200 pieces</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">per design, every product</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">line — sizes included</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Sample USD 25 + 20</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">custom sample in 3–5 days;</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">stock samples free;</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">USD 25 delivery charge</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Production 15–20 days</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">typically after sample</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">approval; confirm each</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">order in writing</text><text x="60" y="640" font-size="11.5" fill="#6b6258">Free digital dieline preview available to confirm the proposed structure; ask for order-specific timing in writing.</text>
</g>
</svg>
