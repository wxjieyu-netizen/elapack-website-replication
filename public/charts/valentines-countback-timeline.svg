<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Plan a Valentine's program by counting back from February 14">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Plan a Valentine's program by counting back from February 14</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Each stage consumes calendar before the box ships — the sample approval is the stage that slips most</text>
<rect x="30.0" y="150" width="180.0" height="170" rx="6" fill="#18120c"/><text x="120.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Feb 14 on shelf</text><text x="120.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">stock landed, photographed</text><text x="120.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">and listed — the fixed</text><text x="120.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">end date</text><line x1="216.0" y1="235.0" x2="258.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M264.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="270.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="360.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">In the warehouse</text><text x="360.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">customs, receiving and</text><text x="360.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">fulfilment buffer before</text><text x="360.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">the retail date</text><line x1="456.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M504.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="510.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">At sea or in the air</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">freight mode sets the</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">cost and the cutoff</text><text x="600.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">date, not preference</text><line x1="696.0" y1="235.0" x2="738.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M744.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="750.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="840.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Production window</text><text x="840.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">15–20 working days at</text><text x="840.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">standard quantities</text><text x="840.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">after sample approval</text><line x1="936.0" y1="235.0" x2="978.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M984.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="990.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1080.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Sample approval</text><text x="1080.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">the first stage — and</text><text x="1080.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">the one every later</text><text x="1080.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">stage waits on</text><text x="60" y="640" font-size="11.5" fill="#6b6258">Count backwards: the date the sample is approved is the date the whole program starts.</text>
</g>
</svg>
