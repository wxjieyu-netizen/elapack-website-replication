<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <rect width="1200" height="675" fill="#FAF7F2"/>
  <g transform="translate(47.727 0) scale(1.53409)">

    <rect width="720" height="440" fill="#FAF7F2"/>
    <text x="360" y="42" text-anchor="middle" font-size="24" fill="#2B2B2B">The empty-space ratio, measured</text>
    <text x="360" y="66" text-anchor="middle" font-size="13" fill="#7A7A7A">Filler counts as empty space (as-published compliance readings). Volumes illustrative.</text>
    <defs>
      <pattern id="void" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#EFE7DC"/><line x1="0" y1="0" x2="0" y2="8" stroke="#D8C9B4" stroke-width="2"/>
      </pattern>
    </defs>
    <line x1="360" y1="90" x2="360" y2="390" stroke="#D8C9B4" stroke-width="1"/>
    <rect x="70" y="110" width="220" height="240" fill="url(#void)" stroke="#8A7A5E" stroke-width="2"/>
    <rect x="150" y="250" width="90" height="80" fill="#5E6E5A" stroke="#3E4A3B"/>
    <text x="180" y="378" text-anchor="middle" font-size="14" fill="#2B2B2B">40 × 30 × 15 cm shipper</text>
    <text x="180" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#9C3D2E">60% empty — fails from 2030</text>
    <text x="120" y="140" font-size="12" fill="#7A6A4E">air + filler = empty space</text>
    <rect x="430" y="170" width="180" height="160" fill="url(#void)" stroke="#8A7A5E" stroke-width="2"/>
    <rect x="470" y="210" width="100" height="100" fill="#5E6E5A" stroke="#3E4A3B"/>
    <text x="520" y="358" text-anchor="middle" font-size="14" fill="#2B2B2B">33 × 25 × 12 cm shipper</text>
    <text x="520" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E5E46">27% empty — passes</text>
    <text x="500" y="140" text-anchor="middle" font-size="13" fill="#7A7A7A">product volume 7,200 cm³ — identical in both boxes</text>
    <line x1="70" y1="132" x2="290" y2="132" stroke="#9C3D2E" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="360" y="420" text-anchor="middle" font-size="12" fill="#7A7A7A">Ratio = (box volume − product volume) ÷ box volume · cap ≤ 50% from 1 January 2030</text>
  </g>
</svg>
