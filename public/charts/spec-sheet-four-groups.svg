<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The four groups a packaging spec sheet divides into">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">The four groups a packaging spec sheet divides into</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Read each group in context before comparing quotes — single lines quoted in isolation are where launches slip</text>
<rect x="60" y="120" width="272" height="105" rx="6" fill="#18120c"/><text x="196.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Materials</text><text x="196.0" y="172" text-anchor="middle" font-size="11.5" fill="#b08d46">substrate, gram weight,</text><text x="196.0" y="189" text-anchor="middle" font-size="11.5" fill="#b08d46">board grade, lining</text><rect x="354" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="490.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Structure</text><text x="490.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">style, dimensions, closure,</text><text x="490.0" y="189" text-anchor="middle" font-size="11.5" fill="#6b6258">insert format</text><rect x="648" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="784.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Print and finish</text><text x="784.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">method, colours, coverage,</text><text x="784.0" y="189" text-anchor="middle" font-size="11.5" fill="#6b6258">special processes</text><rect x="942" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1078.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Logistics</text><text x="1078.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">pack-out, carton size,</text><text x="1078.0" y="189" text-anchor="middle" font-size="11.5" fill="#6b6258">stacking, labelling</text><text x="60" y="640" font-size="11.5" fill="#6b6258">Then the five-line fit check: contents · weight · transit · shelf · unboxing — one line each, before the brief goes out.</text>
</g>
</svg>
