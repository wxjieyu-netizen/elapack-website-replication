<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The same gift packed two ways">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">The same gift packed two ways</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Compare constructions on the packing sequence the box creates — not on a photo of the closed box</text>
<rect x="120" y="130" width="420" height="240" rx="6" fill="#18120c"/><text x="330.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Magnetic closure</text><text x="330.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">flip-top or hinged lid, hidden magnets</text><text x="330.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">· pack: place product, close lid</text><text x="330.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">· open: one hand, re-closable</text><text x="330.0" y="233" text-anchor="middle" font-size="11.5" fill="#b08d46">· unboxing reads instant</text><rect x="660" y="130" width="420" height="240" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="870.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Ribbon tie</text><text x="870.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">loose lid or fold construction, ribbon</text><text x="870.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">wrapped and tied by hand</text><text x="870.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">· pack: place, wrap, tie, fluff bow</text><text x="870.0" y="233" text-anchor="middle" font-size="11.5" fill="#6b6258">· open: untie, re-tie if kept</text><line x1="548" y1="250.0" x2="646" y2="250.0" stroke="#b08d46" stroke-width="1.5"/><path d="M652 250.0 l-9 -5 v10 z" fill="#b08d46"/><text x="60" y="640" font-size="11.5" fill="#6b6258">A ribbon is often added to a magnetic box rather than replacing it — state which construction the quote is for.</text>
</g>
</svg>
