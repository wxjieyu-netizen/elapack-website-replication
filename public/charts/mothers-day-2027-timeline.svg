<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Mother's Day 2027 packaging timeline: three ordering routes counted back from May 9 around the Chinese New Year and May Day factory closures">
