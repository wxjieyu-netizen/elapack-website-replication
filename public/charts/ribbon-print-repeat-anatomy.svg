<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="What &quot;logo on a ribbon&quot; has to specify">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">What "logo on a ribbon" has to specify</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Three separable decisions — width fit, repeat position, and the approval on an assembled sample — not one instruction</text>
<rect x="30.0" y="150" width="340.0" height="170" rx="6" fill="#18120c"/><text x="200.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Ribbon width ≠ printable width</text><text x="200.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">printable area sits inside the edge</text><text x="200.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">weave; brief the logo to the</text><text x="200.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">printable width, not the ribbon</text><line x1="376.0" y1="235.0" x2="418.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M424.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="430.0" y="150" width="340.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Repeat along the length</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">distance between repeats must clear</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">where the bow or knot forms,</text><text x="600.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">on both faces if printed duplex</text><line x1="776.0" y1="235.0" x2="818.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M824.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="830.0" y="150" width="340.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Approve on the assembled sample</text><text x="1000.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">the repeat is judged wrapped and</text><text x="1000.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">tied — a flat proof cannot show</text><text x="1000.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">where the logo lands</text></g>
</svg>
