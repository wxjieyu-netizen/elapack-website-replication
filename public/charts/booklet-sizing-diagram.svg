<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Sizing a booklet box: two interior zones, then board thickness on each side</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">Suppliers quote on outer size — products live in the inner one; record both in the spec</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="260" y="360" width="340" height="480" rx="8" fill="white" stroke="#28251f" stroke-width="5"/><rect x="620" y="360" width="760" height="480" rx="8" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><line x1="620" y1="360" x2="620" y2="840" stroke="#aa8438" stroke-width="8"/><text x="440" y="300" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">front cover (closes over)</text><text x="620" y="890" font-size="26" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">spine</text><rect x="670" y="420" width="380" height="360" fill="none" stroke="#6f675a" stroke-width="3" stroke-dasharray="10 8"/><text x="860" y="560" font-size="28" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">ZONE A</text><text x="860" y="605" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">product footprint</text><text x="860" y="640" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">+ a few mm clearance</text><line x1="670" y1="960" x2="1050" y2="960" stroke="#aa8438" stroke-width="3"/><line x1="670" y1="960" x2="670.0" y2="974.0" stroke="#aa8438" stroke-width="3"/><line x1="1050" y1="960" x2="1050.0" y2="974.0" stroke="#aa8438" stroke-width="3"/><text x="860.0" y="948.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">product zone width</text><rect x="1110" y="420" width="220" height="360" fill="none" stroke="#6f675a" stroke-width="3" stroke-dasharray="10 8"/><text x="1220" y="560" font-size="28" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">ZONE B</text><text x="1220" y="605" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">closed stack of</text><text x="1220" y="640" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">printed pages</text><line x1="1110" y1="960" x2="1330" y2="960" stroke="#aa8438" stroke-width="3"/><line x1="1110" y1="960" x2="1110.0" y2="974.0" stroke="#aa8438" stroke-width="3"/><line x1="1330" y1="960" x2="1330.0" y2="974.0" stroke="#aa8438" stroke-width="3"/><text x="1220.0" y="948.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">sleeve width</text><rect x="1620" y="300" width="680" height="340" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1648" y="352" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Measure contents first</text><text x="1648" y="400" font-size="28" fill="#28251f" font-family="Arial">Let the box follow the contents:</text><text x="1648" y="444" font-size="28" fill="#28251f" font-family="Arial">measure each zone, then add board</text><text x="1648" y="488" font-size="28" fill="#28251f" font-family="Arial">thickness per side to reach outer</text><text x="1648" y="532" font-size="28" fill="#28251f" font-family="Arial">dimensions.</text><rect x="1620" y="680" width="680" height="340" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1648" y="732" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Loaded sample</text><text x="1648" y="780" font-size="28" fill="#28251f" font-family="Arial">A cavity that fits in the workshop may</text><text x="1648" y="824" font-size="28" fill="#28251f" font-family="Arial">let contents shift after filling and</text><text x="1648" y="868" font-size="28" fill="#28251f" font-family="Arial">shipping — ask for a fitted, closed,</text><text x="1648" y="912" font-size="28" fill="#28251f" font-family="Arial">shaken sample.</text><text x="300" y="1040" font-size="28" font-weight="700" fill="#aa8438" font-family="Arial">Outer = inner + board thickness on each side — quote outer, spec both.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>