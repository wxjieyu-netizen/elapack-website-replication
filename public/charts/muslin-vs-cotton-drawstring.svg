<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Muslin versus standard cotton drawstring bags: weave, weight, hand feel and print surface compared">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Same production line, different weave</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Say which one the enquiry means — the weave changes the print surface and the hand</text>
    <g font-family="Helvetica,Arial,sans-serif">
      <!-- muslin bag -->
      <path d="M 60 96 h 150 v 170 h -150 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 60 96 q 30 -30 60 0 q 30 -30 60 0 q 30 -30 30 0" fill="none" stroke="#18120c" stroke-width="1.5"/>
      <line x1="60" y1="116" x2="210" y2="116" stroke="#b08d46" stroke-width="1.5"/>
      <circle cx="96" cy="116" r="5" fill="none" stroke="#b08d46" stroke-width="1.5"/>
      <circle cx="174" cy="116" r="5" fill="none" stroke="#b08d46" stroke-width="1.5"/>
      <!-- plain weave hatch -->
      <g stroke="#c9b68c" stroke-width="0.8">
        <line x1="76" y1="140" x2="76" y2="250"/><line x1="106" y1="140" x2="106" y2="250"/>
        <line x1="136" y1="140" x2="136" y2="250"/><line x1="166" y1="140" x2="166" y2="250"/>
        <line x1="196" y1="140" x2="196" y2="250"/>
        <line x1="66" y1="160" x2="204" y2="160"/><line x1="66" y1="190" x2="204" y2="190"/><line x1="66" y1="220" x2="204" y2="220"/>
      </g>
      <text x="135" y="290" text-anchor="middle" font-size="13" fill="#18120c">Muslin — plain weave</text>
      <text x="135" y="307" text-anchor="middle" font-size="11" fill="#6b6258">≈ 90–150 gsm band · soft hand</text>
      <text x="135" y="322" text-anchor="middle" font-size="11" fill="#6b6258">natural or bleached · fine print surface</text>

      <!-- standard cotton bag -->
      <path d="M 420 96 h 150 v 170 h -150 z" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 420 96 q 30 -30 60 0 q 30 -30 60 0 q 30 -30 30 0" fill="none" stroke="#18120c" stroke-width="1.5"/>
      <line x1="420" y1="116" x2="570" y2="116" stroke="#b08d46" stroke-width="1.5"/>
      <circle cx="456" cy="116" r="5" fill="none" stroke="#b08d46" stroke-width="1.5"/>
      <circle cx="534" cy="116" r="5" fill="none" stroke="#b08d46" stroke-width="1.5"/>
      <!-- tighter weave -->
      <g stroke="#b0997a" stroke-width="0.8">
        <line x1="436" y1="140" x2="436" y2="250"/><line x1="458" y1="140" x2="458" y2="250"/>
        <line x1="480" y1="140" x2="480" y2="250"/><line x1="502" y1="140" x2="502" y2="250"/>
        <line x1="524" y1="140" x2="524" y2="250"/><line x1="546" y1="140" x2="546" y2="250"/>
        <line x1="428" y1="152" x2="562" y2="152"/><line x1="428" y1="172" x2="562" y2="172"/>
        <line x1="428" y1="192" x2="562" y2="192"/><line x1="428" y1="212" x2="562" y2="212"/>
        <line x1="428" y1="232" x2="562" y2="232"/>
      </g>
      <text x="495" y="290" text-anchor="middle" font-size="13" fill="#18120c">Standard cotton drawstring</text>
      <text x="495" y="307" text-anchor="middle" font-size="11" fill="#6b6258">firmer weave · fuller body</text>
      <text x="495" y="322" text-anchor="middle" font-size="11" fill="#6b6258">the generic product type</text>
    </g>
    <text x="24" y="366" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">Both run on the same production line — single or double drawstring, print or embroidery, cut to the product's dimensions.</text>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Weights and conventions as published by bag suppliers; ELAPACK's muslin grade is confirmed per project on the quotation.</text>
  </g>
</svg>
