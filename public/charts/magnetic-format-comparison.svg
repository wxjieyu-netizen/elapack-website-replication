<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Assembled vs collapsible: the same magnetic box, two delivery formats</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">A warehouse and freight decision — the finished box looks identical once erected</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="100" y="240" width="1020" height="880" rx="18" fill="white" stroke="#d8d2c6" stroke-width="3"/><text x="130" y="295" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">ASSEMBLED</text><rect x="220" y="420" width="640" height="420" rx="10" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><line x1="220" y1="500" x2="860" y2="500" stroke="#28251f" stroke-width="3" stroke-dasharray="10 8"/><circle cx="640" cy="460" r="16" fill="#aa8438"/><circle cx="640" cy="445" r="0"/><text x="540" y="390" font-size="28" fill="#6f675a" font-family="Arial">closes ready-fitted with magnet pairs</text><text x="220" y="930" font-size="30" font-weight="700" fill="#28251f" font-family="Arial">Arrives ready to pack</text><text x="220" y="975" font-size="26" fill="#6f675a" font-family="Arial">Confirm packed dimensions, packing quantity</text><text x="220" y="1015" font-size="26" fill="#6f675a" font-family="Arial">per carton and the packing workflow fit.</text><rect x="1280" y="240" width="1020" height="880" rx="18" fill="white" stroke="#d8d2c6" stroke-width="3"/><text x="1310" y="295" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">COLLAPSIBLE (FLAT-PACKED)</text><rect x="1430" y="440" width="300" height="340" rx="8" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><line x1="1430" y1="555" x2="1730" y2="555" stroke="#28251f" stroke-width="3"/><line x1="1430" y1="670" x2="1730" y2="670" stroke="#28251f" stroke-width="3"/><text x="1580" y="820" font-size="28" fill="#6f675a" font-family="Arial" text-anchor="middle">ships as a flat folded stack</text><line x1="1800" y1="610" x2="2060" y2="610" stroke="#aa8438" stroke-width="4" marker-end="url(#ah)"/><rect x="2100" y="440" width="120" height="340" rx="6" fill="none" stroke="#28251f" stroke-width="5"/><text x="2160" y="820" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">erect on site</text><text x="1310" y="930" font-size="30" font-weight="700" fill="#28251f" font-family="Arial">Receiving team folds it into shape</text><text x="1310" y="975" font-size="26" fill="#6f675a" font-family="Arial">Confirm the assembly method, a sample, and</text><text x="1310" y="1015" font-size="26" fill="#6f675a" font-family="Arial">packed dimensions; check the team can</text><text x="1310" y="1055" font-size="26" fill="#6f675a" font-family="Arial">assemble consistently.</text><text x="100" y="1160" font-size="28" font-weight="700" fill="#aa8438" font-family="Arial">Flat shipment can cut storage and freight volume — but savings depend on packing, quantity, destination and assembly work. Compare like-for-like delivered quotes.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>