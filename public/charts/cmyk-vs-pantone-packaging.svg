<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" role="img" aria-label="Comparison chart of CMYK process colour and Pantone spot colour for custom packaging">
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="0.5" stop-color="#b08d46"/><stop offset="1" stop-color="#e8c96a"/></linearGradient></defs>
<rect width="2400" height="1350" fill="#faf8f4"/>
<rect width="2400" height="190" fill="#28251f"/>
<text x="130" y="112" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700" fill="#ffffff">CMYK vs Pantone for custom packaging</text>
<text x="130" y="162" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#cfc9bd">Two colour systems, compared for packaging buyers</text>
<text x="580" y="292" font-family="Arial" font-size="46" font-weight="700" fill="#28251f">CMYK — process colour</text>
<text x="1460" y="292" font-family="Arial" font-size="46" font-weight="700" fill="#28251f">Pantone — spot colour</text>
<line x1="580" y1="318" x2="1400" y2="318" stroke="#b08d46" stroke-width="4"/>
<line x1="1460" y1="318" x2="2270" y2="318" stroke="#b08d46" stroke-width="4"/>
<text x="130" y="394" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">How colour is made</text>
<text x="580" y="394" font-family="Arial" font-size="42" fill="#28251f">Four inks printed as</text>
<text x="580" y="446" font-family="Arial" font-size="42" fill="#28251f">overlapping dot patterns</text>
<text x="1460" y="394" font-family="Arial" font-size="42" fill="#28251f">One pre-mixed ink per colour,</text>
<text x="1460" y="446" font-family="Arial" font-size="42" fill="#28251f">printed as a solid</text>
<line x1="130" y1="452" x2="2270" y2="452" stroke="#ddd6c9" stroke-width="2"/>
<text x="130" y="512" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">Best for</text>
<text x="580" y="512" font-family="Arial" font-size="42" fill="#28251f">Photographs, gradients and</text>
<text x="580" y="564" font-family="Arial" font-size="42" fill="#28251f">full-colour artwork</text>
<text x="1460" y="512" font-family="Arial" font-size="42" fill="#28251f">Logos and brand colours</text>
<text x="1460" y="564" font-family="Arial" font-size="42" fill="#28251f">that must match exactly</text>
<line x1="130" y1="570" x2="2270" y2="570" stroke="#ddd6c9" stroke-width="2"/>
<text x="130" y="630" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">Brand-colour</text>
<text x="130" y="682" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">consistency</text>
<text x="580" y="630" font-family="Arial" font-size="42" fill="#28251f">Steady only while the</text>
<text x="580" y="682" font-family="Arial" font-size="42" fill="#28251f">four-ink balance holds</text>
<text x="1460" y="630" font-family="Arial" font-size="42" fill="#28251f">Mixed to a formula — the</text>
<text x="1460" y="682" font-family="Arial" font-size="42" fill="#28251f">reference is the ink itself</text>
<line x1="130" y1="688" x2="2270" y2="688" stroke="#ddd6c9" stroke-width="2"/>
<text x="130" y="748" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">Metallics &</text>
<text x="130" y="800" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">fluorescents</text>
<text x="580" y="748" font-family="Arial" font-size="42" fill="#28251f">Cannot be built from</text>
<text x="580" y="800" font-family="Arial" font-size="42" fill="#28251f">the four process inks</text>
<text x="1460" y="748" font-family="Arial" font-size="42" fill="#28251f">Foil or a metallic stock —</text>
<text x="1460" y="800" font-family="Arial" font-size="42" fill="#28251f">a separate process</text>
<line x1="130" y1="806" x2="2270" y2="806" stroke="#ddd6c9" stroke-width="2"/>
<text x="130" y="866" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">Cost drivers</text>
<text x="580" y="866" font-family="Arial" font-size="42" fill="#28251f">Four plates cover every</text>
<text x="580" y="918" font-family="Arial" font-size="42" fill="#28251f">colour in the design</text>
<text x="1460" y="866" font-family="Arial" font-size="42" fill="#28251f">One to two plates</text>
<text x="1460" y="918" font-family="Arial" font-size="42" fill="#28251f">per spot colour</text>
<line x1="130" y1="924" x2="2270" y2="924" stroke="#ddd6c9" stroke-width="2"/>
<text x="130" y="984" font-family="Arial" font-size="42" font-weight="700" fill="#28251f">Approved against</text>
<text x="580" y="984" font-family="Arial" font-size="42" fill="#28251f">The physical sample,</text>
<text x="580" y="1036" font-family="Arial" font-size="42" fill="#28251f">within ΔE ≤ 2.0</text>
<text x="1460" y="984" font-family="Arial" font-size="42" fill="#28251f">The named Pantone reference</text>
<text x="1460" y="1036" font-family="Arial" font-size="42" fill="#28251f">and the physical sample</text>
<text x="130" y="1096" font-family="Arial" font-size="44" font-weight="700" fill="#28251f">Which colours sit outside the CMYK gamut</text>
<rect x="130" y="1122" width="110" height="80" fill="#7fa3c0"/>
<rect x="258" y="1122" width="110" height="80" fill="#a8b98a"/>
<rect x="386" y="1122" width="110" height="80" fill="#c9a227"/>
<rect x="514" y="1122" width="110" height="80" fill="#b0766a"/>
<rect x="642" y="1122" width="110" height="80" fill="#8d7fb8"/>
<rect x="960" y="1122" width="110" height="80" fill="#ff6a00" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="1088" y="1122" width="110" height="80" fill="#0047ff" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="1216" y="1122" width="110" height="80" fill="url(#gold)" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="1344" y="1122" width="110" height="80" fill="#ff2fb3" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 6"/>
<text x="130" y="1248" font-family="Arial" font-size="34" fill="#6b675c">Typical print colours — inside the gamut</text>
<text x="960" y="1248" font-family="Arial" font-size="34" fill="#6b675c">Vivid orange · electric blue · metallic · fluorescent — outside it</text>
<text x="130" y="1308" font-family="Arial" font-size="30" fill="#6b675c">Swatches are illustrative screen colours, not printed references — judge colour on a physical sample.</text>
</svg>
