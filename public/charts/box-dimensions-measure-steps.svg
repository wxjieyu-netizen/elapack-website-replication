<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Measuring tape placed inside an open box with three numbered arrows: one along the longest inside edge marked length, one across the shorter opening marked width, one vertical from inside bottom to top edge marked height">
  <rect width="1200" height="675" fill="#faf9f7"/>

  <text x="48" y="52" font-family="Georgia,serif" font-size="27" font-weight="600" fill="#18120c">Measure the box you have</text>
  <text x="48" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b6258">Tape inside the box · box open · inside edge to inside edge · one decimal · unit stated</text>
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#b08d46" stroke-width="1.5"/>

  <!-- ===== open box in perspective ===== -->
  <polygon points="140,470 500,470 500,330 140,330" fill="#e8e2d6" stroke="#18120c" stroke-width="4"/>
  <polygon points="500,470 558,436 558,296 500,330" fill="#d8cebd" stroke="#18120c" stroke-width="4"/>
  <polygon points="140,330 500,330 558,296 198,296" fill="#efe9dd" stroke="#18120c" stroke-width="4"/>
  <line x1="140" y1="470" x2="198" y2="436" stroke="#8d857a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="198" y1="436" x2="558" y2="436" stroke="#8d857a" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- tape lying inside the opening -->
  <rect x="165" y="306" width="330" height="13" fill="#b08d46"/>
  <rect x="160" y="304" width="5" height="17" fill="#8d857a"/>
  <line x1="183.5" y1="306" x2="183.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="202" y1="306" x2="202" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="220.5" y1="306" x2="220.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="239" y1="306" x2="239" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="257.5" y1="306" x2="257.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="276" y1="306" x2="276" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="294.5" y1="306" x2="294.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="313" y1="306" x2="313" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="331.5" y1="306" x2="331.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="350" y1="306" x2="350" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="368.5" y1="306" x2="368.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="387" y1="306" x2="387" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="405.5" y1="306" x2="405.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="424" y1="306" x2="424" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="442.5" y1="306" x2="442.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="461" y1="306" x2="461" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="479.5" y1="306" x2="479.5" y2="319" stroke="#faf9f7" stroke-width="1"/>
  <line x1="555" y1="312" x2="596" y2="272" stroke="#8d857a" stroke-width="1"/>
  <text x="602" y="268" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">tape — read edge to edge</text>

  <!-- 1 length: below, inside edge to inside edge -->
  <line x1="140" y1="470" x2="140" y2="514" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="470" x2="500" y2="514" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="148" y1="520" x2="492" y2="520" stroke="#b08d46" stroke-width="3"/>
  <polygon points="140,520 154,513 154,527" fill="#b08d46"/>
  <polygon points="500,520 486,513 486,527" fill="#b08d46"/>
  <circle cx="118" cy="520" r="13" fill="#b08d46"/>
  <text x="118" y="525" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#faf9f7">1</text>
  <text x="320" y="547" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">Length — inside edge to inside edge</text>
  <text x="320" y="568" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">longest side of the opening</text>

  <!-- 2 width: projected above the short rim edge -->
  <line x1="500" y1="330" x2="500" y2="242" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="558" y1="296" x2="558" y2="242" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="508" y1="250" x2="550" y2="250" stroke="#b08d46" stroke-width="3"/>
  <polygon points="500,250 514,243 514,257" fill="#b08d46"/>
  <polygon points="558,250 544,243 544,257" fill="#b08d46"/>
  <circle cx="479" cy="250" r="13" fill="#b08d46"/>
  <text x="479" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#faf9f7">2</text>
  <text x="529" y="226" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">Width — shorter opening side</text>

  <!-- 3 height: right of the front-right vertical edge -->
  <line x1="508" y1="470" x2="612" y2="470" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="508" y1="330" x2="612" y2="330" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="620" y1="338" x2="620" y2="462" stroke="#b08d46" stroke-width="3"/>
  <polygon points="620,330 613,344 627,344" fill="#b08d46"/>
  <polygon points="620,470 613,456 627,456" fill="#b08d46"/>
  <circle cx="620" cy="306" r="13" fill="#b08d46"/>
  <text x="620" y="311" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#faf9f7">3</text>
  <text x="640" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">Height</text>
  <text x="640" y="408" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">inside bottom to</text>
  <text x="640" y="424" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">inside top edge</text>
  <text x="640" y="444" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">flaps not counted</text>

  <!-- ===== right card ===== -->
  <rect x="760" y="130" width="392" height="470" fill="#f4f0e8" stroke="#d9d2c4" stroke-width="1"/>
  <text x="784" y="170" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#18120c">Record it once, record it right</text>

  <text x="784" y="208" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">Open the box and stand it upright</text>
  <text x="784" y="236" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">Inside edge to inside edge — L, then W, then H</text>
  <text x="784" y="264" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">One decimal, unit stated every time</text>

  <rect x="784" y="292" width="344" height="54" fill="#ffffff" stroke="#d9d2c4" stroke-width="1"/>
  <text x="956" y="316" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">30.0 × 20.0 × 10.0 cm</text>
  <text x="956" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">three figures · one unit · no flaps in the height</text>

  <text x="784" y="384" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">Stock cartons run ±1/8 in manufacturing variance —</text>
  <text x="784" y="402" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">a product that exactly equals the cavity leaves no</text>
  <text x="784" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">room for it. Fit-critical orders are confirmed</text>
  <text x="784" y="438" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">on a physical sample, not on the drawing.</text>

  <rect x="784" y="470" width="344" height="64" fill="#f7e9e5" stroke="#a03b2c" stroke-width="1"/>
  <text x="804" y="494" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a03b2c">A printed size is a claim to check</text>
  <text x="804" y="514" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">measure the box you actually have — variance applies</text>
  <text x="804" y="530" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">to the carton in hand as much as to the catalogue one.</text>

  <text x="784" y="576" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Volume, when a carrier needs it: L × W × H.</text>

  <text x="48" y="640" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">One decimal is not fussiness — it keeps tolerance from quietly eating the fit.</text>
</svg>
