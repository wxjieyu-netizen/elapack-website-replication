<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three-column comparison of velvet, satin and muslin pouch materials on weave, drape, laundering behaviour and best-fit product">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">Velvet, satin, muslin: hand feel and drape</text>
<g transform="translate(48,105) scale(1.45)">
  <rect x="0" y="30" width="225" height="260" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
