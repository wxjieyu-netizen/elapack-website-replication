  <text x="263" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">weave: tight sheen weave</text>
  <text x="263" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">drape: fluid, cool</text>
  <text x="263" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">care: confirm for the selected fabric</text>
  <text x="263" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">best fit:</text>
  <text x="263" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">gift &amp; bridal pieces</text>
  <rect x="490" y="30" width="225" height="260" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="508" y="62" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#18120c" text-anchor="start" font-weight="bold">Muslin</text>
  <text x="508" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">weave: plain open weave</text>
  <text x="508" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">drape: soft, matte</text>
  <text x="508" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b6258" text-anchor="start" font-weight="normal">care: confirm for the selected fabric</text>
  <text x="508" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">best fit:</text>
  <text x="508" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">everyday &amp; craft pieces</text>
</g>
  <text x="600" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">The product\'s weight and the laundering it must survive pick the material — the comparison is the buying step.</text>
