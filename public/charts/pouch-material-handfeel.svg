  <text x="18" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">best fit:</text>
  <text x="18" y="192" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#b08d46" text-anchor="start" font-weight="normal">statement jewellery</text>
  <rect x="245" y="30" width="225" height="260" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
