<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="Arial, Helvetica, sans-serif">
  <rect width="2400" height="1350" fill="#faf8f4"/>
  <rect x="0" y="0" width="2400" height="270" fill="#28251f"/>
  <text x="140" y="118" font-size="62" font-weight="bold" fill="#faf8f4">The sunglasses pouch material brief</text>
  <text x="140" y="196" font-size="38" fill="#c9c2b2">Five fields that identify the actual material — not its marketing name</text>

  <g font-size="40">
    <circle cx="205" cy="390" r="42" fill="#28251f"/><text x="205" y="405" text-anchor="middle" font-weight="bold" fill="#faf8f4">1</text>
    <text x="290" y="378" font-weight="bold" fill="#28251f">Fabric reference &amp; fibre composition</text>
    <text x="290" y="436" font-size="35" fill="#6b675c">Identifies the proposed material rather than a generic fabric name</text>
    <line x1="140" y1="486" x2="2260" y2="486" stroke="#ddd6c9" stroke-width="2"/>

    <circle cx="205" cy="586" r="42" fill="#28251f"/><text x="205" y="601" text-anchor="middle" font-weight="bold" fill="#faf8f4">2</text>
    <text x="290" y="574" font-weight="bold" fill="#28251f">Weight or construction</text>
    <text x="290" y="632" font-size="35" fill="#6b675c">Provides a measurable basis for the sample and quotation</text>
    <line x1="140" y1="682" x2="2260" y2="682" stroke="#ddd6c9" stroke-width="2"/>

    <circle cx="205" cy="782" r="42" fill="#28251f"/><text x="205" y="797" text-anchor="middle" font-weight="bold" fill="#faf8f4">3</text>
    <text x="290" y="770" font-weight="bold" fill="#28251f">Contact surface</text>
    <text x="290" y="828" font-size="35" fill="#6b675c">Seams, print, pile or trim that may touch the frames or lenses</text>
    <line x1="140" y1="878" x2="2260" y2="878" stroke="#ddd6c9" stroke-width="2"/>

    <circle cx="205" cy="978" r="42" fill="#28251f"/><text x="205" y="993" text-anchor="middle" font-weight="bold" fill="#faf8f4">4</text>
    <text x="290" y="966" font-weight="bold" fill="#28251f">Colour and finish</text>
    <text x="290" y="1024" font-size="35" fill="#6b675c">Allows transfer and appearance to be checked</text>
    <line x1="140" y1="1074" x2="2260" y2="1074" stroke="#ddd6c9" stroke-width="2"/>

    <circle cx="205" cy="1174" r="42" fill="#28251f"/><text x="205" y="1189" text-anchor="middle" font-weight="bold" fill="#faf8f4">5</text>
    <text x="290" y="1162" font-weight="bold" fill="#28251f">Care and intended use</text>
    <text x="290" y="1220" font-size="35" fill="#6b675c">Defines the checks needed before a repeated-use claim</text>
  </g>

  <text x="140" y="1312" font-size="30" fill="#6b675c">Confirm the actual fabric reference and availability in the quotation  ·  elapack.com</text>
</svg>
