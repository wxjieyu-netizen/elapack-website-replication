<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Five decisions that specify a subscription programme">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Five decisions that specify a subscription programme</text>
<text x="60" y="78" font-size="13" fill="#6b6258">A subscription box is bought as a programme, not as a box — replenishment cadence changes every line above it</text>
<rect x="30.0" y="150" width="180.0" height="170" rx="6" fill="#18120c"/><text x="120.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Box structure</text><text x="120.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">mailer or rigid, one or</text><text x="120.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">two-piece — set by the</text><text x="120.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">unboxing role</text><line x1="216.0" y1="235.0" x2="258.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M264.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="270.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="360.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Size tier</text><text x="360.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">one box that fits the range</text><text x="360.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">of months, or a tiered</text><text x="360.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">size set</text><line x1="456.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M504.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="510.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Print programme</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">fixed artwork or monthly</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">variable print — a factory</text><text x="600.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">capability question</text><line x1="696.0" y1="235.0" x2="738.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M744.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="750.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="840.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Insert plan</text><text x="840.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">trays, pouches and cards</text><text x="840.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">refreshed per month</text><line x1="936.0" y1="235.0" x2="978.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M984.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="990.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1080.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Cadence</text><text x="1080.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">order rhythm and forecast</text><text x="1080.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">that the MOQ and</text><text x="1080.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">lead times must carry</text></g>
</svg>
