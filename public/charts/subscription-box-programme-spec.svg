<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" width="480" height="790" role="img" aria-label="Five decisions that specify a subscription programme">
<rect width="480" height="790" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#18120c">
<text x="24" y="38" font-size="23" font-weight="600">Five decisions for a recurring</text>
<text x="24" y="68" font-size="23" font-weight="600">packaging programme</text>
<text x="24" y="100" font-size="18">Illustrative planning framework</text>
<rect x="24" y="125" width="432" height="112" rx="6" fill="none" stroke="#b08d46"/>
<text x="42" y="156" font-size="22" font-weight="600">Box structure</text>
<text x="42" y="186" font-size="20">Product fit, packing and</text>
<text x="42" y="211" font-size="20">delivery route reviewed together</text>
<rect x="24" y="255" width="432" height="112" rx="6" fill="none" stroke="#b08d46"/>
<text x="42" y="286" font-size="22" font-weight="600">Inside components</text>
<text x="42" y="316" font-size="20">Insert, pouch and card specified</text>
<text x="42" y="341" font-size="20">by their actual function</text>
<rect x="24" y="385" width="432" height="112" rx="6" fill="none" stroke="#b08d46"/>
<text x="42" y="416" font-size="22" font-weight="600">Edition changes</text>
<text x="42" y="446" font-size="20">Confirm which parts change</text>
<text x="42" y="471" font-size="20">and which remain fixed</text>
<rect x="24" y="515" width="432" height="112" rx="6" fill="none" stroke="#b08d46"/>
<text x="42" y="546" font-size="22" font-weight="600">Transit checks</text>
<text x="42" y="576" font-size="20">Review loaded pack</text>
<text x="42" y="601" font-size="20">and proposed outer</text>
<rect x="24" y="645" width="432" height="112" rx="6" fill="none" stroke="#b08d46"/>
<text x="42" y="676" font-size="22" font-weight="600">Order terms</text>
<text x="42" y="706" font-size="20">Confirm quantities, approvals</text>
<text x="42" y="731" font-size="20">and timing for the programme</text>
</g></svg>