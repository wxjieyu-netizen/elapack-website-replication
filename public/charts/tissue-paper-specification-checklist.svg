<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"><rect width="2400" height="1350" fill="#faf8f4"/><g font-family="Arial, sans-serif" fill="#28251f"><text x="120" y="165" font-size="82" font-weight="bold">Custom Tissue Paper — Specification Checklist</text><text x="120" y="248" font-size="42" fill="#6b675c">Confirm each field in the quotation and on the sample — GSM alone decides none of them.</text><g font-size="40" font-weight="bold" fill="#6b675c"><text x="120" y="392">FIELD</text><text x="540" y="392">WHAT TO REQUEST</text><text x="1500" y="392">SAMPLE CHECK</text></g><line x1="120" y1="432" x2="2280" y2="432" stroke="#ddd6c9" stroke-width="3"/><g font-size="45"><text x="120" y="540" font-weight="bold">Paper</text><text x="540" y="540">Proposed GSM, finish, colour, composition</text><text x="1500" y="540">Feel, translucency, fold</text><line x1="120" y1="592" x2="2280" y2="592" stroke="#ddd6c9" stroke-width="2"/><text x="120" y="700" font-weight="bold">Print</text><text x="540" y="700">Process, colour count, repeat layout</text><text x="1500" y="700">Detail, contrast, placement</text><line x1="120" y1="752" x2="2280" y2="752" stroke="#ddd6c9" stroke-width="2"/><text x="120" y="860" font-weight="bold">Contact</text><text x="540" y="860">Product surfaces, storage conditions</text><text x="1500" y="860">Transfer, visible marking</text><line x1="120" y1="912" x2="2280" y2="912" stroke="#ddd6c9" stroke-width="2"/><text x="120" y="1020" font-weight="bold">Sheet fit</text><text x="540" y="1020">Box interior, product, folding sequence</text><text x="1500" y="1020">Coverage without bulk</text><line x1="120" y1="1072" x2="2280" y2="1072" stroke="#ddd6c9" stroke-width="2"/><text x="120" y="1180" font-weight="bold">Packing</text><text x="540" y="1180">Sheet count, packing sequence</text><text x="1500" y="1180">Repeatable assembly</text></g><text x="120" y="1290" font-size="36" fill="#6b675c">ELAPACK — tissue is a separate set component; each component has a 200-piece minimum.</text></g></svg>
