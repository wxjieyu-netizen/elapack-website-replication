<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="OEM, ODM and white label: who owns what">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">OEM, ODM and white label: who owns what</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Three production models named by who owns the design — the words set what you can change and what you cannot</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">OEM</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">you own the design; the factory</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">builds to your spec, your</text><text x="200.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">tooling, your inspection</text><text x="200.0" y="233" text-anchor="middle" font-size="11.5" fill="#b08d46">standard</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">ODM</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">the factory owns a design</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">you configure — sizes,</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">finishes, print slots within</text><text x="600.0" y="233" text-anchor="middle" font-size="11.5" fill="#6b6258">an existing structure</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">White label</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">a stock product carries your</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">mark; fastest to launch,</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">least differentiation</text><text x="60" y="640" font-size="11.5" fill="#6b6258">Logo technique follows the surface, not the model: screen and heat transfer on fabric, foil and emboss on paper, deboss on leather board.</text>
</g>
</svg>
