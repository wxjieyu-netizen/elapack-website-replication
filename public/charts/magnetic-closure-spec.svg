<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">What to pin down when you specify the closure</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">Magnet count and strength follow the actual design — they cannot be read off the box name</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="120" y="300" width="1180" height="150" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="120" y="300" width="12" height="150" rx="6" fill="#aa8438"/><text x="170" y="362" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">1  Arrange</text><text x="170" y="408" font-size="25" fill="#6f675a" font-family="Arial">magnet — or magnet-and-steel — pairing, positions and</text><text x="170" y="444" font-size="25" fill="#6f675a" font-family="Arial">attachment for this design</text><rect x="120" y="500" width="1180" height="150" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="120" y="500" width="12" height="150" rx="6" fill="#aa8438"/><text x="170" y="562" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">2  Sample</text><text x="170" y="608" font-size="25" fill="#6f675a" font-family="Arial">review the assembled sample with the product and insert</text><text x="170" y="644" font-size="25" fill="#6f675a" font-family="Arial">fitted</text><rect x="120" y="700" width="1180" height="150" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="120" y="700" width="12" height="150" rx="6" fill="#aa8438"/><text x="170" y="762" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">3  Check</text><text x="170" y="808" font-size="25" fill="#6f675a" font-family="Arial">flap alignment · closure retention · ease of opening ·</text><text x="170" y="844" font-size="25" fill="#6f675a" font-family="Arial">product restrictions</text><rect x="120" y="900" width="1180" height="150" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="120" y="900" width="12" height="150" rx="6" fill="#aa8438"/><text x="170" y="962" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">4  Repeat</text><text x="170" y="1008" font-size="25" fill="#6f675a" font-family="Arial">agree a repeat-opening check if the box is opened more than</text><text x="170" y="1044" font-size="25" fill="#6f675a" font-family="Arial">once</text><rect x="1380" y="300" width="920" height="780" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1408" y="352" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">No universal spec</text><text x="1408" y="400" font-size="28" fill="#28251f" font-family="Arial">No magnet grade, hole count or attachment</text><text x="1408" y="444" font-size="28" fill="#28251f" font-family="Arial">method in this guide is a universal ELAPACK</text><text x="1408" y="488" font-size="28" fill="#28251f" font-family="Arial">specification. If the project needs a</text><text x="1408" y="532" font-size="28" fill="#28251f" font-family="Arial">particular magnetic or safety assessment,</text><text x="1408" y="576" font-size="28" fill="#28251f" font-family="Arial">name it before quotation and request the</text><text x="1408" y="620" font-size="28" fill="#28251f" font-family="Arial">evidence.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>