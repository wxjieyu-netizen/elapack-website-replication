<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="From jar to box: measured diameter and height plus clearance set the interior, then the insert holds the jar">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Size the box from the measured candle</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Outside diameter, height with the lid on, filled weight — then add clearance</text>
    <g font-family="Helvetica,Arial,sans-serif">
      <!-- jar -->
      <rect x="50" y="96" width="110" height="130" rx="10" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <rect x="62" y="82" width="86" height="16" rx="4" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <line x1="50" y1="244" x2="160" y2="244" stroke="#18120c" stroke-width="1.2"/>
      <line x1="55" y1="238" x2="55" y2="250" stroke="#18120c" stroke-width="1.2"/>
      <line x1="155" y1="238" x2="155" y2="250" stroke="#18120c" stroke-width="1.2"/>
      <text x="105" y="262" text-anchor="middle" font-size="11.5" fill="#18120c">outside Ø, lid-on height</text>

      <!-- clearance arrows -->
      <line x1="168" y1="160" x2="222" y2="160" stroke="#b08d46" stroke-width="2"/>
      <path d="M 222 155 l 9 5 l -9 5 z" fill="#b08d46"/>
      <text x="195" y="150" text-anchor="middle" font-size="11" fill="#6b6258">+ 0.25–0.5"</text>
      <text x="195" y="180" text-anchor="middle" font-size="11" fill="#6b6258">per side</text>

      <!-- box interior -->
      <rect x="240" y="92" width="180" height="150" fill="none" stroke="#18120c" stroke-width="1.5" stroke-dasharray="6 4"/>
      <rect x="252" y="112" width="156" height="118" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <text x="330" y="262" text-anchor="middle" font-size="11.5" fill="#18120c">box interior — one drawing</text>
      <line x1="434" y1="160" x2="488" y2="160" stroke="#b08d46" stroke-width="2"/>
      <path d="M 488 155 l 9 5 l -9 5 z" fill="#b08d46"/>

      <!-- insert -->
      <path d="M 498 92 h 180 v 150 h -180 z" fill="#faf9f7" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 556 122 a 32 32 0 0 1 64 0 v 90 h -64 z" fill="#e5d5b8" stroke="#b08d46" stroke-width="1.5"/>
      <circle cx="588" cy="150" r="20" fill="none" stroke="#18120c" stroke-width="1.5"/>
      <text x="588" y="262" text-anchor="middle" font-size="11.5" fill="#18120c">insert sized to the box</text>
    </g>
    <text x="24" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">Worked reference: a published interior for an 8 oz round lidded jar is 98 × 98 × 110 mm — but the order-relevant numbers come off your own filled vessel.</text>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Clearance rule and worked interior as published by packaging suppliers; weight drives board grade, not just footprint.</text>
  </g>
</svg>
