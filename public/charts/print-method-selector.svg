<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Selector table matching screen print, foil stamp, offset and digital to colour count and run size">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">Choosing the print method</text>
  <text x="520" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b08d46" text-anchor="start" font-weight="bold">Colour reality</text>
  <text x="880" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b08d46" text-anchor="start" font-weight="bold">Run size where it wins</text>
  <rect x="110" y="125" width="300" height="62" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="130" y="162" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Screen print</text>
  <text x="470" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">1–3 spot colours</text>
  <text x="870" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">50–2,000 pcs</text>
  <rect x="110" y="205" width="300" height="62" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="130" y="242" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Foil stamp</text>
  <text x="470" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">1 metallic / 1 colour</text>
  <text x="870" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">any run, per-position tooling</text>
  <rect x="110" y="285" width="300" height="62" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="130" y="322" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Offset / litho</text>
  <text x="470" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">full CMYK coverage</text>
  <text x="870" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">1,000+ pcs</text>
  <rect x="110" y="365" width="300" height="62" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="130" y="402" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Digital</text>
  <text x="470" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">full colour, variable data</text>
  <text x="870" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#18120c" text-anchor="start" font-weight="normal">50–500 pcs</text>
  <text x="600" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Vector artwork, the factory dieline, named Pantones and bleed rules decide the reply — the run size picks the method.</text>
</svg>
