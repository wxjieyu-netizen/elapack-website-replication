<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<rect width="1200" height="675" fill="#faf9f7"/>
<text x="60" y="70" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#18120c">Foam insert construction</text>
<text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b6258">A flocked presentation surface over a die-cut foam core. Branding sits on a paired card fitment — never on the foam itself.</text>

<!-- bottle silhouette seated in the cavity -->
<g stroke="#18120c" stroke-width="2" fill="none">
  <path d="M 385 215 L 385 255 Q 385 272 368 285 L 352 298 L 352 460 L 448 460 L 448 298 L 432 285 Q 415 272 415 255 L 415 215 Z" fill="#ffffff"/>
  <line x1="385" y1="215" x2="415" y2="215"/>
</g>

<!-- cross-section: foam block with recessed cavity -->
<g>
  <path d="M 180 395 L 330 395 L 330 460 L 470 460 L 470 395 L 620 395 L 620 560 L 180 560 Z" fill="#e8e2d6" stroke="#18120c" stroke-width="2"/>
  <path d="M 180 395 L 330 395 L 330 460 L 470 460 L 470 395 L 620 395" fill="none" stroke="#b08d46" stroke-width="9"/>
  <rect x="180" y="560" width="440" height="16" fill="#18120c"/>
</g>

<g font-family="Helvetica, Arial, sans-serif">
  <line x1="250" y1="392" x2="700" y2="240" stroke="#b08d46" stroke-width="1.5"/>
  <circle cx="250" cy="392" r="4" fill="#b08d46"/>
  <text x="712" y="232" font-size="16" font-weight="bold" fill="#18120c">Flocked surface</text>
  <text x="712" y="258" font-size="14" fill="#6b6258">Velvet-like finish lining the top and</text>
  <text x="712" y="280" font-size="14" fill="#6b6258">the cavity, colour-matched to your box lining.</text>

  <line x1="560" y1="500" x2="700" y2="380" stroke="#b08d46" stroke-width="1.5"/>
  <circle cx="560" cy="500" r="4" fill="#b08d46"/>
  <text x="712" y="372" font-size="16" font-weight="bold" fill="#18120c">Foam core</text>
  <text x="712" y="398" font-size="14" fill="#6b6258">EVA, sponge or pearl cotton (EPE),</text>
  <text x="712" y="420" font-size="14" fill="#6b6258">die-cut to your product's geometry.</text>

  <line x1="400" y1="568" x2="700" y2="520" stroke="#b08d46" stroke-width="1.5"/>
  <circle cx="400" cy="568" r="4" fill="#b08d46"/>
  <text x="712" y="512" font-size="16" font-weight="bold" fill="#18120c">Paired card fitment (optional)</text>
  <text x="712" y="538" font-size="14" fill="#6b6258">Carries print and in-box branding</text>
  <text x="712" y="560" font-size="14" fill="#6b6258">beside the product.</text>
</g>
</svg>