<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three magnetic closure structures: flip-top jacket, lid-and-base and collapsible builds, showing where the magnets catch">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Three builds, three magnet paths</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">The trade name says where the magnet catches — that is the specification</text>
    <g font-family="Helvetica,Arial,sans-serif">
      <!-- flip-top jacket -->
      <path d="M 40 110 v 110 h 190 v -110 l -24 -30 h -142 z" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <rect x="52" y="128" width="166" height="80" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <circle cx="135" cy="212" r="7" fill="#b08d46"/>
      <circle cx="135" cy="236" r="7" fill="none" stroke="#b08d46" stroke-width="2"/>
      <text x="40" y="264" font-size="13" fill="#18120c">Magnetic lid gift box</text>
      <text x="40" y="281" font-size="11" fill="#6b6258">magnet catches in the lid rim</text>
      <text x="40" y="296" font-size="11" fill="#6b6258">jacket + tray, 2–3 magnet sets</text>

      <!-- lid-and-base -->
      <rect x="300" y="92" width="200" height="52" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <rect x="312" y="152" width="176" height="78" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <circle cx="400" cy="144" r="7" fill="#b08d46"/>
      <circle cx="400" cy="160" r="7" fill="none" stroke="#b08d46" stroke-width="2"/>
      <text x="300" y="264" font-size="13" fill="#18120c">Lid-and-base</text>
      <text x="300" y="281" font-size="11" fill="#6b6258">magnet holds the lift-off lid</text>
      <text x="300" y="296" font-size="11" fill="#6b6258">sets, fragrance, multi-piece</text>

      <!-- collapsible -->
      <path d="M 570 110 h 190 v 112 h -190 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 570 110 l 40 -26 h 190 l -40 26 z" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 760 110 l 40 -26 v 112 l -40 26 z" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <circle cx="578" cy="222" r="6" fill="#b08d46"/>
      <circle cx="754" cy="222" r="6" fill="#b08d46"/>
      <text x="570" y="264" font-size="13" fill="#18120c">Collapsible</text>
      <text x="570" y="281" font-size="11" fill="#6b6258">walls fold, magnets hold the fold</text>
      <text x="570" y="296" font-size="11" fill="#6b6258">ships flat — freight-efficient</text>
    </g>
    <text x="24" y="356" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">Rigid ships assembled and keeps the premium unboxing; foldable trades a fold-and-tuck step for a fraction of the freight.</text>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Anatomy as published by box manufacturers; magnet counts and positions confirmed per project on the quotation.</text>
  </g>
</svg>
