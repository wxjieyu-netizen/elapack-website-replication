<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Inside a PR box: the contents pattern every launch shares</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">A product loose in a box arrives as if shipped — seated in a fitment, it arrives as if presented</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="240" y="330" width="1080" height="640" rx="10" fill="#f1ece2" stroke="#28251f" stroke-width="6"/><rect x="300" y="400" width="420" height="330" rx="10" fill="white" stroke="#28251f" stroke-width="4"/><rect x="360" y="450" width="300" height="230" rx="8" fill="none" stroke="#6f675a" stroke-width="3" stroke-dasharray="10 8"/><text x="510" y="560" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">HERO PRODUCT</text><text x="510" y="605" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">cut cavity or lined recess</text><rect x="760" y="400" width="480" height="160" rx="8" fill="white" stroke="#28251f" stroke-width="4"/><text x="880" y="470" font-size="26" fill="#28251f" font-family="Arial" text-anchor="middle">CARD OR</text><text x="880" y="505" font-size="26" fill="#28251f" font-family="Arial" text-anchor="middle">FOLDED NOTE</text><text x="1000" y="545" font-size="22" fill="#6f675a" font-family="Arial" text-anchor="middle">the one item every PR box shares</text><rect x="760" y="590" width="480" height="140" rx="8" fill="white" stroke="#28251f" stroke-width="4"/><text x="1000" y="650" font-size="26" fill="#28251f" font-family="Arial" text-anchor="middle">POUCH · CARE CARD</text><text x="880" y="688" font-size="22" fill="#6f675a" font-family="Arial" text-anchor="middle">optional secondaries</text><rect x="300" y="760" width="760" height="160" rx="8" fill="none" stroke="#aa8438" stroke-width="4" stroke-dasharray="12 8"/><text x="680" y="820" font-size="27" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">FITMENT LAYER</text><text x="680" y="850" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">recessed board · moulded pulp · foam alternative</text><text x="680" y="886" font-size="24" fill="#6f675a" font-family="Arial" text-anchor="middle">holds the product in place — makes the first photo look intentional</text><rect x="1420" y="330" width="880" height="320" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1448" y="382" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Part count is the quiet cost driver</text><text x="1448" y="430" font-size="28" fill="#28251f" font-family="Arial">Every additional item is another</text><text x="1448" y="474" font-size="28" fill="#28251f" font-family="Arial">component to produce, kit and pack —</text><text x="1448" y="518" font-size="28" fill="#28251f" font-family="Arial">each one should earn its place in the</text><text x="1448" y="562" font-size="28" fill="#28251f" font-family="Arial">photo.</text><rect x="1420" y="690" width="880" height="280" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1448" y="742" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">One hero, not a crowd</text><text x="1448" y="790" font-size="28" fill="#28251f" font-family="Arial">One hero product photographs better than</text><text x="1448" y="834" font-size="28" fill="#28251f" font-family="Arial">a crowd of them; a tight selection beats</text><text x="1448" y="878" font-size="28" fill="#28251f" font-family="Arial">a full catalogue.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>