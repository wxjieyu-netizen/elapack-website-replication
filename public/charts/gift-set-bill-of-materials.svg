<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Quote a gift set as a counted list, not as &quot;a set&quot;">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Quote a gift set as a counted list, not as "a set"</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Every component named, counted and owned — the three fields that make two supplier quotes comparable</text>
<circle cx="88" cy="186.0" r="20" fill="#18120c"/><text x="88" y="191.0" text-anchor="middle" font-size="15" fill="#faf9f7">1</text><rect x="130" y="140" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Build the bill of materials</text><text x="635.0" y="192" text-anchor="middle" font-size="11.5" fill="#6b6258">outer box, inserts, pouches, ribbon, cards — one line each,</text><text x="635.0" y="209" text-anchor="middle" font-size="11.5" fill="#6b6258">named by material and size</text><circle cx="88" cy="296.0" r="20" fill="#18120c"/><text x="88" y="301.0" text-anchor="middle" font-size="15" fill="#faf9f7">2</text><rect x="130" y="250" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Count what goes into each version</text><text x="635.0" y="302" text-anchor="middle" font-size="11.5" fill="#6b6258">quantities per set for every tier or version being quoted</text><circle cx="88" cy="406.0" r="20" fill="#18120c"/><text x="88" y="411.0" text-anchor="middle" font-size="15" fill="#faf9f7">3</text><rect x="130" y="360" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Name the assembly responsibilities</text><text x="635.0" y="412" text-anchor="middle" font-size="11.5" fill="#6b6258">who folds, who fills, who packs out — assembly is a cost line</text></g>
</svg>
