<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="#F8F8F8"/><text x="70" y="72" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="600" fill="#3d3d3d">AQL sampling plan for a custom packaging order</text><text x="70" y="104" font-family="Montserrat, Arial, sans-serif" font-size="16" fill="#808080">ISO 2859-1, single sampling, General Inspection Level II, normal inspection</text><rect x="60" y="140" width="840" height="52" fill="#808080"/><text x="80" y="173" font-family="Montserrat, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="start">Lot size (pieces)</text><text x="410" y="173" font-family="Montserrat, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">Sample size</text><text x="590" y="173" font-family="Montserrat, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">Accept at AQL 2.5</text><text x="790" y="173" font-family="Montserrat, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">Accept at AQL 4.0</text><rect x="60" y="192" width="840" height="52" fill="#ffffff"/><text x="80" y="225" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#3d3d3d" text-anchor="start">501 – 1,200</text><text x="410" y="225" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">80</text><text x="590" y="225" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">5</text><text x="790" y="225" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">7</text><rect x="60" y="244" width="840" height="52" fill="#efefef"/><text x="80" y="277" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#3d3d3d" text-anchor="start">1,201 – 3,200</text><text x="410" y="277" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">125</text><text x="590" y="277" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">7</text><text x="790" y="277" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">10</text><rect x="60" y="296" width="840" height="52" fill="#ffffff"/><text x="80" y="329" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#3d3d3d" text-anchor="start">3,201 – 10,000</text><text x="410" y="329" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">200</text><text x="590" y="329" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">10</text><text x="790" y="329" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">14</text><rect x="60" y="348" width="840" height="52" fill="#efefef"/><text x="80" y="381" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#3d3d3d" text-anchor="start">10,001 – 35,000</text><text x="410" y="381" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">315</text><text x="590" y="381" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">14</text><text x="790" y="381" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#3d3d3d" text-anchor="middle">21</text><rect x="60" y="140" width="840" height="260" fill="none" stroke="#d9d9d9"/><text x="70" y="438" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#808080">Reject number = accept number + 1. Critical defects are set to AQL 0: one critical defect fails the lot.</text><text x="70" y="464" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#808080">Sample size follows the lot-size band, not the exact quantity ordered.</text></svg>