<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Fabric and logo method matrix: which branding method suits velvet, microfiber, cotton and satin pouches">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Which logo method suits which fabric?</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Screen print, foil, heat transfer or embroidery — rated for velvet, microfiber, cotton and satin pouch fabrics</text>
<rect x="240" y="118" width="215" height="64" rx="6" fill="#18120c"/>
<text x="347.5" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Screen printing</text>
<rect x="465" y="118" width="215" height="64" rx="6" fill="#18120c"/>
<text x="572.5" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Hot stamping</text>
<text x="572.5" y="166" text-anchor="middle" font-size="12" fill="#b08d46">(foil)</text>
<rect x="690" y="118" width="215" height="64" rx="6" fill="#18120c"/>
<text x="797.5" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Heat transfer</text>
<rect x="915" y="118" width="215" height="64" rx="6" fill="#18120c"/>
<text x="1022.5" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Embroidery</text>
<rect x="60" y="192" width="170" height="100" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
<text x="145.0" y="248.0" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Velvet</text>
<rect x="240" y="192" width="215" height="100" rx="6" fill="#c98a2d"/>
<text x="347.5" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Use caution</text>
<text x="347.5" y="250" text-anchor="middle" font-size="11.5" fill="#ffffff">pile hides</text>
<text x="347.5" y="268" text-anchor="middle" font-size="11.5" fill="#ffffff">fine detail</text>
<rect x="465" y="192" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="572.5" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="572.5" y="250" text-anchor="middle" font-size="11.5" fill="#faf9f7">metallic luxury</text>
<text x="572.5" y="268" text-anchor="middle" font-size="11.5" fill="#faf9f7">finish</text>
<rect x="690" y="192" width="215" height="100" rx="6" fill="#d8d2c8"/>
<text x="797.5" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#6b6258">Not recommended</text>
<text x="797.5" y="250" text-anchor="middle" font-size="11.5" fill="#6b6258">pile makes it</text>
<text x="797.5" y="268" text-anchor="middle" font-size="11.5" fill="#6b6258">generally unsuitable</text>
<rect x="915" y="192" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="1022.5" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="1022.5" y="250" text-anchor="middle" font-size="11.5" fill="#faf9f7">premium, tactile</text>
<text x="1022.5" y="268" text-anchor="middle" font-size="11.5" fill="#faf9f7">finish</text>
<rect x="60" y="300" width="170" height="100" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
<text x="145.0" y="356.0" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Microfiber</text>
<rect x="240" y="300" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="347.5" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="347.5" y="358" text-anchor="middle" font-size="11.5" fill="#faf9f7">clean on smooth,</text>
<text x="347.5" y="376" text-anchor="middle" font-size="11.5" fill="#faf9f7">tight surface</text>
<rect x="465" y="300" width="215" height="100" rx="6" fill="#e9dcc0"/>
<text x="572.5" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Test on a sample</text>
<text x="572.5" y="358" text-anchor="middle" font-size="11.5" fill="#18120c">depends on</text>
<text x="572.5" y="376" text-anchor="middle" font-size="11.5" fill="#18120c">the weave</text>
<rect x="690" y="300" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="797.5" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="797.5" y="358" text-anchor="middle" font-size="11.5" fill="#faf9f7">full colour,</text>
<text x="797.5" y="376" text-anchor="middle" font-size="11.5" fill="#faf9f7">fine detail</text>
<rect x="915" y="300" width="215" height="100" rx="6" fill="#a8bfa4"/>
<text x="1022.5" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Good</text>
<text x="1022.5" y="358" text-anchor="middle" font-size="11.5" fill="#18120c">works on</text>
<text x="1022.5" y="376" text-anchor="middle" font-size="11.5" fill="#18120c">medium weight</text>
<rect x="60" y="408" width="170" height="100" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
<text x="145.0" y="464.0" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Cotton</text>
<rect x="240" y="408" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="347.5" y="442" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="347.5" y="466" text-anchor="middle" font-size="11.5" fill="#faf9f7">classic pairing,</text>
<text x="347.5" y="484" text-anchor="middle" font-size="11.5" fill="#faf9f7">one-colour logos</text>
<rect x="465" y="408" width="215" height="100" rx="6" fill="#e9dcc0"/>
<text x="572.5" y="442" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Test on a sample</text>
<text x="572.5" y="466" text-anchor="middle" font-size="11.5" fill="#18120c">depends on</text>
<text x="572.5" y="484" text-anchor="middle" font-size="11.5" fill="#18120c">the weave</text>
<rect x="690" y="408" width="215" height="100" rx="6" fill="#a8bfa4"/>
<text x="797.5" y="442" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Good</text>
<text x="797.5" y="466" text-anchor="middle" font-size="11.5" fill="#18120c">film can feel</text>
<text x="797.5" y="484" text-anchor="middle" font-size="11.5" fill="#18120c">firmer than ink</text>
<rect x="915" y="408" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="1022.5" y="442" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="1022.5" y="466" text-anchor="middle" font-size="11.5" fill="#faf9f7">holds well,</text>
<text x="1022.5" y="484" text-anchor="middle" font-size="11.5" fill="#faf9f7">durable</text>
<rect x="60" y="516" width="170" height="100" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
<text x="145.0" y="572.0" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Satin</text>
<rect x="240" y="516" width="215" height="100" rx="6" fill="#a8bfa4"/>
<text x="347.5" y="550" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Good</text>
<text x="347.5" y="574" text-anchor="middle" font-size="11.5" fill="#18120c">test for</text>
<text x="347.5" y="592" text-anchor="middle" font-size="11.5" fill="#18120c">ink spread</text>
<rect x="465" y="516" width="215" height="100" rx="6" fill="#2f5d3a"/>
<text x="572.5" y="550" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Excellent</text>
<text x="572.5" y="574" text-anchor="middle" font-size="11.5" fill="#faf9f7">clean, mirror-like</text>
<text x="572.5" y="592" text-anchor="middle" font-size="11.5" fill="#faf9f7">finish</text>
<rect x="690" y="516" width="215" height="100" rx="6" fill="#a8bfa4"/>
<text x="797.5" y="550" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Good</text>
<text x="797.5" y="574" text-anchor="middle" font-size="11.5" fill="#18120c">good on</text>
<text x="797.5" y="592" text-anchor="middle" font-size="11.5" fill="#18120c">smooth satin</text>
<rect x="915" y="516" width="215" height="100" rx="6" fill="#c98a2d"/>
<text x="1022.5" y="550" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Use caution</text>
<text x="1022.5" y="574" text-anchor="middle" font-size="11.5" fill="#ffffff">check for</text>
<text x="1022.5" y="592" text-anchor="middle" font-size="11.5" fill="#ffffff">puckering</text>
<text x="60" y="648" font-size="11.5" fill="#6b6258">Ratings are starting points for a sample enquiry, not measured performance rankings — approve the method on a sample of the actual fabric.</text>
</g>
</svg>
