<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Five decisions that customize an eyelash box">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Five decisions that customize an eyelash box</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Format first — the tray and the lid style decide what the print and the size can even be</text>
<rect x="30.0" y="150" width="180.0" height="170" rx="6" fill="#18120c"/><text x="120.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Format</text><text x="120.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">sleeve and tray, hinged box</text><text x="120.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">or slide drawer — the</text><text x="120.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">handling model</text><line x1="216.0" y1="235.0" x2="258.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M264.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="270.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="360.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Tray</text><text x="360.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">slots per pair, magnet strip</text><text x="360.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">or card slip</text><line x1="456.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M504.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="510.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Size</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">driven by tray count, not</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">by the shelf guess</text><line x1="696.0" y1="235.0" x2="738.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M744.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="750.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="840.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Print</text><text x="840.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">coverage and finish on the</text><text x="840.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">outer face</text><line x1="936.0" y1="235.0" x2="978.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M984.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="990.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1080.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Order quantity</text><text x="1080.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">the tier that the tooling</text><text x="1080.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">and unit price hang on</text></g>
</svg>
