<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="One bag for two jobs is the classic wrong order">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">One bag for two jobs is the classic wrong order</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The retail bag presents and is kept; the shipping bag protects — specify them as two lines</text>
<rect x="120" y="130" width="420" height="240" rx="6" fill="#18120c"/><text x="330.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Retail bag</text><text x="330.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">satin or silk-touch, sized to</text><text x="330.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">the folded wig, branded,</text><text x="330.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">kept by the customer for</text><text x="330.0" y="233" text-anchor="middle" font-size="11.5" fill="#b08d46">storage</text><rect x="660" y="130" width="420" height="240" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="870.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Shipping outer</text><text x="870.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">poly or kraft mailer sized</text><text x="870.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">to the boxed retail piece,</text><text x="870.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">opaque, sealed for transit</text><line x1="548" y1="250.0" x2="646" y2="250.0" stroke="#b08d46" stroke-width="1.5"/><path d="M652 250.0 l-9 -5 v10 z" fill="#b08d46"/></g>
</svg>
