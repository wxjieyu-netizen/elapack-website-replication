<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The sequence a logo pouch has to be approved in">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">The sequence a logo pouch has to be approved in</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The fabric is fixed before the logo method — reversing the order is what produces a logo that cannot be produced as sampled</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">1 · Fix fabric and construction</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">the pouch the logo must live on:</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">fabric, panel shape, seams, closure</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">2 · Match the method to that fabric</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">screen print, heat transfer, embroidery,</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">woven label — each reads differently</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">per substrate</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">3 · Approve the complete spec</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">size, placement, colour reference,</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">contrast base — in writing</text><text x="60" y="640" font-size="11.5" fill="#6b6258">A logo approved on a swatch is not approved on the pouch — sign off on the finished construction.</text>
</g>
</svg>
