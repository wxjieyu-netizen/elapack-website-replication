<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"><rect width="2400" height="1350" fill="#faf8f4"/><g font-family="Arial, sans-serif" fill="#28251f"><text x="120" y="130" font-size="34" letter-spacing="5">ELAPACK · BUYER CHECKLIST</text><text x="120" y="270" font-size="66">Fit the actual jewellery layout</text><line x1="120" y1="450" x2="2280" y2="450" stroke="#ddd5c5"/><text x="120" y="530" font-size="42" fill="#aa8438">01</text><text x="250" y="530" font-size="43" font-weight="bold">Jewellery</text><text x="770" y="525" font-size="36">Record chain length, pendant size and intended display</text><text x="770" y="579" font-size="36">position.</text><line x1="120" y1="670" x2="2280" y2="670" stroke="#ddd5c5"/><text x="120" y="750" font-size="42" fill="#aa8438">02</text><text x="250" y="750" font-size="43" font-weight="bold">Support</text><text x="770" y="745" font-size="36">Confirm tabs, slots or other support with a loaded sample.</text><line x1="120" y1="890" x2="2280" y2="890" stroke="#ddd5c5"/><text x="120" y="970" font-size="42" fill="#aa8438">03</text><text x="250" y="970" font-size="43" font-weight="bold">Dimensions</text><text x="770" y="965" font-size="36">Distinguish box exterior, usable interior and insert</text><text x="770" y="1019" font-size="36">dimensions.</text><line x1="120" y1="1165" x2="2280" y2="1165" stroke="#aa8438"/><text x="120" y="1240" font-size="29">Illustrative buyer guidance · confirm project specifications and sample scope</text><text x="120" y="1290" font-size="26">elapack.com · Editorial diagram, not a product photograph or test result</text></g></svg>