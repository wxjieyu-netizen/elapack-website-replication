<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Drawstring versus zipper jewellery pouch: opening shape, removal action and catch points compared">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="54" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Two closures, two openings</text>
  <text x="60" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6b6258">The closure changes the opening size, the removal action and where the item can catch — test both with the real product</text>

  <!-- drawstring pouch -->
  <g font-family="Helvetica,Arial,sans-serif">
    <path d="M 80 130 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0 q 20 -26 40 0" fill="none" stroke="#18120c" stroke-width="2"/>
    <path d="M 80 130 L 80 340 q 0 16 16 16 L 344 356 q 16 0 16 -16 L 360 130" fill="#efe6d8" stroke="#18120c" stroke-width="2"/>
    <path d="M 150 140 q 0 -20 10 -20 q 10 0 10 20 M 230 140 q 0 -20 10 -20 q 10 0 10 20 M 310 140 q 0 -20 10 -20 q 10 0 10 20" fill="none" stroke="#b08d46" stroke-width="2"/>
    <circle cx="170" cy="122" r="4" fill="#b08d46"/><circle cx="270" cy="122" r="4" fill="#b08d46"/>
    <text x="220" y="392" text-anchor="middle" font-size="14" fill="#18120c">Drawstring</text>
    <text x="220" y="410" text-anchor="middle" font-size="11.5" fill="#6b6258">gathered mouth · cord pull</text>
    <text x="220" y="426" text-anchor="middle" font-size="11.5" fill="#6b6258">catch: cord channel, seam</text>
  </g>

  <!-- zipper pouch -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="500" y="130" width="260" height="226" rx="8" fill="#efe6d8" stroke="#18120c" stroke-width="2"/>
    <path d="M 500 130 L 500 130 h 260" stroke="#18120c" stroke-width="2"/>
    <line x1="500" y1="130" x2="760" y2="130" stroke="#8a7a5e" stroke-width="3"/>
    <rect x="600" y="122" width="34" height="16" rx="3" fill="#b08d46"/>
    <rect x="646" y="118" width="14" height="24" rx="2" fill="#18120c"/>
    <text x="630" y="392" text-anchor="middle" font-size="14" fill="#18120c">Zipper</text>
    <text x="630" y="410" text-anchor="middle" font-size="11.5" fill="#6b6258">fixed opening · slider pull</text>
    <text x="630" y="426" text-anchor="middle" font-size="11.5" fill="#6b6258">catch: teeth, slider, lining</text>
  </g>

  <!-- comparison band -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="820" y="130" width="320" height="226" rx="8" fill="#ffffff" stroke="#ddd5c5"/>
    <text x="840" y="160" font-size="13" font-weight="600" fill="#18120c">What to test on each</text>
    <text x="840" y="188" font-size="12" fill="#6b6258">Pass the real item through the mouth</text>
    <text x="840" y="214" font-size="12" fill="#6b6258">Open one-handed</text>
    <text x="840" y="240" font-size="12" fill="#6b6258">Find where the item can catch</text>
    <text x="840" y="266" font-size="12" fill="#6b6258">Check the closed shape</text>
    <line x1="840" y1="286" x2="1120" y2="286" stroke="#ddd5c5"/>
    <text x="840" y="312" font-size="11.5" fill="#6b6258">Neither closure is tamper-proof</text>
    <text x="840" y="330" font-size="11.5" fill="#6b6258">or universally better in transit.</text>
  </g>

  <text x="60" y="620" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">elapack.com · Illustrative construction — confirm the actual closure, fabric and fit on the sample</text>
</svg>
