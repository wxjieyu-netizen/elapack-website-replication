  <title id="t">Ring box structure — the three layers</title>
  <desc id="d">Exploded illustration of a custom ring box: a deep-colour lid shell labelled exterior wrap, a grey structural shell labelled rigid board, and a base tray with a slotted pad and ring labelled insert.</desc>

