<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four layers build a subscription box cost">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Four layers build a subscription box cost</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Unit price is the sum of four separable lines — compare quotes layer by layer, or the comparison is not one</text>
<circle cx="88" cy="186.0" r="20" fill="#18120c"/><text x="88" y="191.0" text-anchor="middle" font-size="15" fill="#faf9f7">1</text><rect x="130" y="140" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Structure</text><text x="635.0" y="192" text-anchor="middle" font-size="11.5" fill="#6b6258">board grade and box style — the biggest single swing in unit cost</text><circle cx="88" cy="296.0" r="20" fill="#18120c"/><text x="88" y="301.0" text-anchor="middle" font-size="15" fill="#faf9f7">2</text><rect x="130" y="250" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Print and finish</text><text x="635.0" y="302" text-anchor="middle" font-size="11.5" fill="#6b6258">coverage, colours, special processes; the per-unit cost of the look</text><circle cx="88" cy="406.0" r="20" fill="#18120c"/><text x="88" y="411.0" text-anchor="middle" font-size="15" fill="#faf9f7">3</text><rect x="130" y="360" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Inserts and fill</text><text x="635.0" y="412" text-anchor="middle" font-size="11.5" fill="#6b6258">trays, pouches, cards — counted per box, quoted per set</text><circle cx="88" cy="516.0" r="20" fill="#18120c"/><text x="88" y="521.0" text-anchor="middle" font-size="15" fill="#faf9f7">4</text><rect x="130" y="470" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Freight and assembly</text><text x="635.0" y="522" text-anchor="middle" font-size="11.5" fill="#6b6258">shipped flat vs assembled, packed out — the hidden layer in "cheap" quotes</text></g>
</svg>
