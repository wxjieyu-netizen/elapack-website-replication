<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Press-on nail box formats by how the set is used">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Press-on nail box formats by how the set is used</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The tray decides the box — formats differ on whether the set is stored in the pack or decanted</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Clamshell tray</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">hinged case the customer</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">reuses to store the set</text><text x="200.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">between wears</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Sleeve and tray</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">slider sleeve over a fitted</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">tray; nail tips stay sorted</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">by size</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Box with size grid</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">rigid or folding box with</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">numbered slots; premium</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">gift positioning</text></g>
</svg>
