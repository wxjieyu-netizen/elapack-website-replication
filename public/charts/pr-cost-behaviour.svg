<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Where the money goes in a PR box run</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">One structural design, one set of tooling, one print run — split across the mailing list</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><line x1="150" y1="880" x2="1200" y2="880" stroke="#28251f" stroke-width="4"/><rect x="1400" y="330" width="40" height="40" fill="#28251f"/><text x="1460" y="356" font-size="28" font-weight="700" fill="#28251f" font-family="Arial">Structure + print</text><text x="1460" y="392" font-size="24" fill="#6f675a" font-family="Arial">the baseline</text><rect x="1400" y="460" width="40" height="40" fill="#aa8438"/><text x="1460" y="486" font-size="28" font-weight="700" fill="#28251f" font-family="Arial">Fitment tooling</text><text x="1460" y="522" font-size="24" fill="#6f675a" font-family="Arial">cavity or mould adds tooling</text><rect x="1400" y="590" width="40" height="40" fill="#6f675a"/><text x="1460" y="616" font-size="28" font-weight="700" fill="#28251f" font-family="Arial">Variable items</text><text x="1460" y="652" font-size="24" fill="#6f675a" font-family="Arial">pouches, cards, sleeves multiply part count</text><rect x="180" y="500" width="260" height="380" fill="#28251f" opacity="0.92"/><rect x="180" y="360" width="260" height="140" fill="#aa8438" opacity="0.74"/><rect x="180" y="280" width="260" height="80" fill="#6f675a" opacity="0.56"/><text x="310" y="930" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">200 pcs · (entry order)</text><rect x="500" y="580" width="260" height="300" fill="#28251f" opacity="0.92"/><rect x="500" y="460" width="260" height="120" fill="#aa8438" opacity="0.74"/><rect x="500" y="390" width="260" height="70" fill="#6f675a" opacity="0.56"/><text x="630" y="930" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">1,000 pcs</text><rect x="820" y="640" width="260" height="240" fill="#28251f" opacity="0.92"/><rect x="820" y="540" width="260" height="100" fill="#aa8438" opacity="0.74"/><rect x="820" y="480" width="260" height="60" fill="#6f675a" opacity="0.56"/><text x="950" y="930" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">5,000 pcs</text><text x="700" y="270" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">Illustrative stack — deeper runs amortise set-up; each added item multiplies part count</text><rect x="1400" y="760" width="900" height="340" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1428" y="812" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">ELAPACK order facts</text><text x="1428" y="860" font-size="28" fill="#28251f" font-family="Arial">Entry order 200 pieces · custom sample</text><text x="1428" y="904" font-size="28" fill="#28251f" font-family="Arial">USD 25 + USD 20 shipping, 3–5 days ·</text><text x="1428" y="948" font-size="28" fill="#28251f" font-family="Arial">production typically 15–20 working days</text><text x="1428" y="992" font-size="28" fill="#28251f" font-family="Arial">after sample approval and payment</text><text x="1428" y="1036" font-size="28" fill="#28251f" font-family="Arial">receipt.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>