<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A sample round defined before it is paid for">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">A sample round defined before it is paid for</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Purpose, scope, checks and the decision rule — the four fields that keep a sample round to one round</text>
<rect x="30.0" y="150" width="240.0" height="170" rx="6" fill="#18120c"/><text x="150.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Purpose</text><text x="150.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">approval of what, exactly:</text><text x="150.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">construction, colour, print</text><text x="150.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">or all three</text><line x1="276.0" y1="235.0" x2="318.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M324.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="330.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="450.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Scope</text><text x="450.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">which pieces in the round —</text><text x="450.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">plain, printed, or with</text><text x="450.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">the real insert</text><line x1="576.0" y1="235.0" x2="618.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M624.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="630.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="750.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Checks</text><text x="750.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">written list of what gets</text><text x="750.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">measured and compared,</text><text x="750.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">under agreed light</text><line x1="876.0" y1="235.0" x2="918.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M924.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="930.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1050.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Decision rule</text><text x="1050.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">what passes, what triggers</text><text x="1050.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">round two — set before</text><text x="1050.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">the sample ships</text></g>
</svg>
