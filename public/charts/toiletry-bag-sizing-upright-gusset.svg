<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Sizing diagram for a gusseted toiletry bag around upright bottles">
  <rect width="1200" height="675" fill="#FAF7F2"/>

  <text x="600" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2B2B2B">Sizing a toiletry bag around upright bottles</text>
  <text x="600" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#7A7A7A">Recommended clearances — confirm usable interior volume on a loaded sample</text>

  <!-- bag shell -->
  <path d="M310 214 L750 214 Q762 214 762 226 L762 470 L298 470 L298 226 Q298 214 310 214 Z" fill="#E9DFD1" stroke="#8A7A5E" stroke-width="2"/>
  <!-- gusset base -->
  <path d="M298 470 L762 470 L742 558 L318 558 Z" fill="#DCCFBE" stroke="#8A7A5E" stroke-width="2"/>
  <line x1="352" y1="470" x2="366" y2="558" stroke="#B7A488" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="708" y1="470" x2="694" y2="558" stroke="#B7A488" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- zip across the top opening -->
  <path d="M310 232 Q338 246 372 240 L688 240 Q722 246 750 232" fill="none" stroke="#5E6E5A" stroke-width="3"/>
  <rect x="586" y="236" width="26" height="9" rx="4" fill="#5E6E5A"/>
  <line x1="592" y1="245" x2="592" y2="256" stroke="#5E6E5A" stroke-width="3" stroke-linecap="round"/>

  <!-- upright bottles -->
  <rect x="392" y="316" width="104" height="200" rx="6" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>
  <rect x="414" y="282" width="60" height="34" rx="4" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>
  <rect x="430" y="266" width="28" height="18" rx="3" fill="#C9B79C" stroke="#8A7A5E" stroke-width="1.5"/>

  <rect x="520" y="368" width="78" height="148" rx="6" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>
  <rect x="538" y="342" width="42" height="28" rx="4" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>

  <rect x="620" y="404" width="86" height="112" rx="6" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>
  <rect x="636" y="382" width="54" height="24" rx="4" fill="#F6F1E8" stroke="#8A7A5E" stroke-width="1.8"/>

  <!-- (A) vertical clearance above the tallest cap -->
  <line x1="430" y1="266" x2="792" y2="266" stroke="#9C3D2E" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="430" y1="240" x2="792" y2="240" stroke="#9C3D2E" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="712" y1="240" x2="712" y2="266" stroke="#9C3D2E" stroke-width="2"/>
  <path d="M712 240 l-5 8 h10 Z" fill="#9C3D2E"/>
  <path d="M712 266 l-5 -8 h10 Z" fill="#9C3D2E"/>
  <text x="728" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9C3D2E">20–30 mm above</text>
  <text x="728" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9C3D2E">the tallest cap</text>

  <!-- (B) working clearance between bag wall and the bottle group -->
  <line x1="306" y1="300" x2="386" y2="300" stroke="#9C3D2E" stroke-width="2"/>
  <path d="M306 300 l8 -5 v10 Z" fill="#9C3D2E"/>
  <path d="M386 300 l-8 -5 v10 Z" fill="#9C3D2E"/>
  <text x="346" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#9C3D2E">15–25 mm</text>
  <line x1="346" y1="304" x2="346" y2="322" stroke="#9C3D2E" stroke-width="1"/>
  <text x="346" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7A7A7A">working</text>
  <text x="346" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7A7A7A">clearance</text>

  <!-- (C) base gusset depth -->
  <line x1="298" y1="470" x2="196" y2="470" stroke="#9C3D2E" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="318" y1="558" x2="196" y2="558" stroke="#9C3D2E" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="214" y1="470" x2="214" y2="558" stroke="#9C3D2E" stroke-width="2"/>
  <path d="M214 470 l-5 8 h10 Z" fill="#9C3D2E"/>
  <path d="M214 558 l-5 -8 h10 Z" fill="#9C3D2E"/>
  <text x="200" y="500" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9C3D2E">Base gusset</text>
  <text x="200" y="518" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9C3D2E">depth</text>
  <text x="200" y="536" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#7A7A7A">what lets it stand</text>

  <!-- (D) combined footprint of the kit -->
  <line x1="392" y1="586" x2="392" y2="566" stroke="#5E6E5A" stroke-width="1"/>
  <line x1="706" y1="586" x2="706" y2="566" stroke="#5E6E5A" stroke-width="1"/>
  <line x1="392" y1="580" x2="706" y2="580" stroke="#5E6E5A" stroke-width="2"/>
  <path d="M392 580 l8 -5 v10 Z" fill="#5E6E5A"/>
  <path d="M706 580 l-8 -5 v10 Z" fill="#5E6E5A"/>
  <text x="549" y="606" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5E6E5A">Combined footprint of the kit, standing side by side</text>

  <!-- (E) bag height, cut size only -->
  <line x1="762" y1="214" x2="1102" y2="214" stroke="#8A7A5E" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="762" y1="558" x2="1102" y2="558" stroke="#8A7A5E" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="1084" y1="214" x2="1084" y2="558" stroke="#8A7A5E" stroke-width="1.5"/>
  <path d="M1084 214 l-4 8 h8 Z" fill="#8A7A5E"/>
  <path d="M1084 558 l-4 -8 h8 Z" fill="#8A7A5E"/>
  <text x="1072" y="366" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5E6E5A">Bag height</text>
  <text x="1072" y="384" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7A7A7A">cut size, not</text>
  <text x="1072" y="400" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7A7A7A">usable volume</text>

  <text x="600" y="652" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7A7A7A">ELAPACK · sizing guidance · confirm on a loaded sample</text>
</svg>
