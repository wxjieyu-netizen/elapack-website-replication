<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect x="0" y="0" width="1200" height="600" fill="#faf8f4"/>
  <text x="56" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="600" fill="#18120c">Jewelry packaging: buying order</text>
  <text x="56" y="114" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b675c">Start with the jewelry&#8217;s dimensions and support needs.</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="56" y="140" width="532" height="104" rx="14" fill="#ffffff" stroke="#ddd6c9"/>
    <text x="84" y="183" font-size="21" font-weight="700" fill="#28251f"><tspan fill="#b08d46">01 &#183; </tspan>Box</text>
    <text x="84" y="215" font-size="16.5" fill="#4a463d">Structure and inside dimensions</text>

    <rect x="612" y="140" width="532" height="104" rx="14" fill="#ffffff" stroke="#ddd6c9"/>
    <text x="640" y="183" font-size="21" font-weight="700" fill="#28251f"><tspan fill="#b08d46">02 &#183; </tspan>Insert</text>
    <text x="640" y="215" font-size="16.5" fill="#4a463d">Support, contact and removal</text>

    <text x="56" y="280" font-size="15.5" fill="#6b675c">Review the box and insert together.</text>

    <rect x="56" y="298" width="532" height="104" rx="14" fill="#ffffff" stroke="#ddd6c9"/>
    <text x="84" y="341" font-size="21" font-weight="700" fill="#28251f"><tspan fill="#b08d46">03 &#183; </tspan>Pouch</text>
    <text x="84" y="373" font-size="16.5" fill="#4a463d">Closures, seams and fit</text>

    <rect x="612" y="298" width="532" height="104" rx="14" fill="#ffffff" stroke="#ddd6c9"/>
    <text x="640" y="341" font-size="21" font-weight="700" fill="#28251f"><tspan fill="#b08d46">04 &#183; </tspan>Card</text>
    <text x="640" y="373" font-size="16.5" fill="#4a463d">Size, slot clearance and artwork</text>

    <rect x="56" y="426" width="1088" height="100" rx="14" fill="#efe9dc" stroke="#c9c2b2"/>
    <text x="84" y="468" font-size="21" font-weight="700" fill="#28251f"><tspan fill="#b08d46">05 &#183; </tspan>Complete set</text>
    <text x="84" y="499" font-size="16.5" fill="#4a463d">Approve fit and colour across the physical samples.</text>

    <text x="56" y="568" font-size="16" fill="#4a463d">Review the retail display separately for its intended use.</text>
  </g>
</svg>
