<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Five decisions that choose a jewelry box">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Five decisions that choose a jewelry box</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Size and insert are one matched pair; lid style and finish follow, branding closes the brief</text>
<rect x="30.0" y="150" width="180.0" height="170" rx="6" fill="#18120c"/><text x="120.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Size</text><text x="120.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">set by the piece and its</text><text x="120.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">chain drop, not by the</text><text x="120.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">shelf</text><line x1="216.0" y1="235.0" x2="258.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M264.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="270.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="360.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Insert</text><text x="360.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">slot, cushion or platform</text><text x="360.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">— the fit the customer</text><text x="360.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">touches</text><line x1="456.0" y1="235.0" x2="498.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M504.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="510.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Lid style</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">hinged, lift-off or magnetic</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">flip-top</text><line x1="696.0" y1="235.0" x2="738.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M744.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="750.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="840.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Finish</text><text x="840.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">wrap paper, colour, foil</text><text x="840.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">or emboss</text><line x1="936.0" y1="235.0" x2="978.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M984.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="990.0" y="150" width="180.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1080.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Branding</text><text x="1080.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">inside print, logo position,</text><text x="1080.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">card or sleeve</text></g>
</svg>
