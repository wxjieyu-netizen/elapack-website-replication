<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four decisions that choose a jewelry pouch">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Four decisions that choose a jewelry pouch</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Each decision constrains the next — the order below is the order a supplier can quote against</text>
<rect x="30.0" y="150" width="240.0" height="170" rx="6" fill="#18120c"/><text x="150.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Fabric</text><text x="150.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">velvet, suede, cotton, muslin,</text><text x="150.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">satin — the read and the</text><text x="150.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">print method follow from it</text><line x1="276.0" y1="235.0" x2="318.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M324.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="330.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="450.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Size</text><text x="450.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">the piece must sit without</text><text x="450.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">folding the chain or crushing</text><text x="450.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">the setting</text><line x1="576.0" y1="235.0" x2="618.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M624.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="630.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="750.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Print</text><text x="750.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">where the mark sits and how</text><text x="750.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">it reads against the fabric</text><text x="750.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">base colour</text><line x1="876.0" y1="235.0" x2="918.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M924.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="930.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1050.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Closure</text><text x="1050.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">drawstring, zipper, flap —</text><text x="1050.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">affects packing time and</text><text x="1050.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">the unboxing read</text></g>
</svg>
