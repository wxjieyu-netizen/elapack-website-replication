<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Eight formats that fit how hair is actually sold">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Eight formats that fit how hair is actually sold</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Grouped by the job in the program — presentation, protection and replenishment lines each pull different formats</text>
<rect x="60" y="120" width="272" height="105" rx="6" fill="#18120c"/><text x="196.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Sleeve + tray box</text><text x="196.0" y="172" text-anchor="middle" font-size="11.5" fill="#b08d46">retail hero piece</text><rect x="354" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="490.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Header-card pouch</text><text x="490.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">bundle workhorse</text><rect x="648" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="784.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Magnetic hinged box</text><text x="784.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">premium line</text><rect x="942" y="120" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1078.0" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Kraft mailer</text><text x="1078.0" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">direct postal outer</text><rect x="60" y="247" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="196.0" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Printed band</text><text x="196.0" y="299" text-anchor="middle" font-size="11.5" fill="#6b6258">lowest-cost refresh</text><rect x="354" y="247" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="490.0" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Drawstring satin bag</text><text x="490.0" y="299" text-anchor="middle" font-size="11.5" fill="#6b6258">wig storage after unbox</text><rect x="648" y="247" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="784.0" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Clear PVC pouch</text><text x="784.0" y="299" text-anchor="middle" font-size="11.5" fill="#6b6258">visibility SKU</text><rect x="942" y="247" width="272" height="105" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1078.0" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Carton shipper</text><text x="1078.0" y="299" text-anchor="middle" font-size="11.5" fill="#6b6258">case-pack protection</text></g>
</svg>
