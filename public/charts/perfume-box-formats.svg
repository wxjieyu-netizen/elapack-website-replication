<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three box formats a fragrance program chooses between">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Three box formats a fragrance program chooses between</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The bottle is fixed before the box is designed — format follows bottle weight, gifting role and retail vs online handling</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Folding carton</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">lightweight retail outer;</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">the economical volume</text><text x="200.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">format for shelf packs</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Rigid shoulder box</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">bottle sits in a die-cut</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">insert inside a wrapped</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">rigid shell — the gift read</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Two-piece set box</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">fragrance plus ancillaries;</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">the insert layout is the</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">design, not the wrap</text></g>
</svg>
