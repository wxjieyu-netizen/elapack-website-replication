<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Garment packaging chosen by what the piece must survive">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Garment packaging chosen by what the piece must survive</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Fold, protect, present — the three answers that pick between bag, mailer and box</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Muslin or cotton bag</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">breathable, reusable, carries</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">the brand into the customer's</text><text x="200.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">drawer</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Kraft mailer</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">light postal outer for one</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">folded piece — the cost</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">and weight floor</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Folded shirt box</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">presentation for gifting and</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">premium lines; needs an</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">inner tissue or wrap decision</text></g>
</svg>
