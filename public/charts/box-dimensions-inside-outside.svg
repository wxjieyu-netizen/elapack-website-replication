<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cross-section of a box wall with arrows marking the inside cavity measured between inner faces and the outside measured over the board, labelled inside = cavity, outside = cavity plus two walls">
  <rect width="1200" height="675" fill="#faf9f7"/>

  <text x="48" y="52" font-family="Georgia,serif" font-size="27" font-weight="600" fill="#18120c">Inside or outside — the board decides</text>
  <text x="48" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b6258">Section through one wall · the quotation describes the cavity, the parcel is priced on the shell</text>
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#b08d46" stroke-width="1.5"/>

  <!-- ===== plan-view cross-section ===== -->
  <!-- board ring: outer rect filled, inner cut out -->
  <rect x="170" y="190" width="480" height="280" fill="#e8e2d6" stroke="#18120c" stroke-width="6"/>
  <rect x="198" y="218" width="424" height="224" fill="#faf9f7" stroke="#8d857a" stroke-width="2"/>

  <!-- board callout on top wall -->
  <line x1="410" y1="204" x2="448" y2="168" stroke="#8d857a" stroke-width="1"/>
  <text x="456" y="164" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#18120c">board 1.6 mm × 2 walls = +3.2 mm</text>
  <text x="456" y="181" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">E-flute shown</text>

  <!-- inside dimension: inner face to inner face -->
  <line x1="198" y1="262" x2="198" y2="396" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="622" y1="262" x2="622" y2="396" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="410" y="380" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">inside — measured inner face to inner face</text>
  <line x1="206" y1="402" x2="614" y2="402" stroke="#b08d46" stroke-width="3"/>
  <polygon points="198,402 212,395 212,409" fill="#b08d46"/>
  <polygon points="622,402 608,395 608,409" fill="#b08d46"/>
  <text x="410" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b6258">100 mm — the cavity the product sits in</text>

  <!-- outside dimension: over the board -->
  <line x1="170" y1="470" x2="170" y2="512" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="650" y1="470" x2="650" y2="512" stroke="#8d857a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="178" y1="518" x2="642" y2="518" stroke="#b08d46" stroke-width="3"/>
  <polygon points="170,518 184,511 184,525" fill="#b08d46"/>
  <polygon points="650,518 636,511 636,525" fill="#b08d46"/>
  <text x="410" y="545" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">outside — measured over the board</text>
  <text x="410" y="567" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b6258">103.2 mm = 100 mm + 2 × 1.6 mm (E-flute)</text>

  <!-- ===== right card ===== -->
  <rect x="780" y="130" width="372" height="470" fill="#f4f0e8" stroke="#d9d2c4" stroke-width="1"/>
  <text x="804" y="168" font-family="Georgia,serif" font-size="20" font-weight="600" fill="#18120c">Where the difference goes</text>

  <text x="804" y="202" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6b6258">CONSTRUCTION</text>
  <text x="948" y="202" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6b6258">BOARD</text>
  <text x="1052" y="202" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6b6258">2 × WALL</text>

  <text x="804" y="234" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#18120c">Folding carton (SBS)</text>
  <text x="948" y="234" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">0.4–0.6 mm</text>
  <text x="1052" y="234" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b08d46">+1.0–1.2 mm</text>
  <line x1="804" y1="250" x2="1128" y2="250" stroke="#e5dfd2" stroke-width="1"/>

  <text x="804" y="280" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#18120c">E-flute corrugated</text>
  <text x="948" y="280" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">1.6 mm</text>
  <text x="1052" y="280" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b08d46">+3.2 mm</text>
  <line x1="804" y1="296" x2="1128" y2="296" stroke="#e5dfd2" stroke-width="1"/>

  <text x="804" y="326" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#18120c">B-flute corrugated</text>
  <text x="948" y="326" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">3.2 mm</text>
  <text x="1052" y="326" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b08d46">+6.4 mm</text>
  <line x1="804" y1="342" x2="1128" y2="342" stroke="#e5dfd2" stroke-width="1"/>

  <text x="804" y="372" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#18120c">Rigid greyboard</text>
  <text x="948" y="372" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">1.5–2.5 mm</text>
  <text x="1052" y="372" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b08d46">+4.5–5.5 mm</text>

  <text x="804" y="404" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Rigid boxes add wrap paper (157 gsm)</text>
  <text x="804" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">and turn-in seams on top of the board.</text>

  <rect x="804" y="442" width="324" height="66" fill="#18120c"/>
  <text x="966" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#faf9f7">outside = inside + 2 × board</text>
  <text x="966" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9d2c4">E-flute: 100 + 3.2 = 103.2 mm</text>

  <rect x="804" y="526" width="324" height="60" fill="#f7e9e5" stroke="#a03b2c" stroke-width="1"/>
  <text x="824" y="550" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a03b2c">Reorder trap</text>
  <text x="824" y="568" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">outside figures sent as the spec come back</text>
  <text x="824" y="582" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">two walls too tight — measure the old box inside</text>

  <text x="48" y="640" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">Both sets are real: inside answers whether the product fits; outside answers what the parcel costs.</text>
</svg>
