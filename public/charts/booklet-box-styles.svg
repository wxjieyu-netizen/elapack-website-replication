<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Lid-and-base vs booklet: what the hinge changes</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">A booklet box is one continuous wrapper — nothing detaches, the cover rotates around a spine</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="100" y="260" width="700" height="760" rx="18" fill="white" stroke="#d8d2c6" stroke-width="3"/><text x="130" y="315" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">CONVENTIONAL RIGID (LID + BASE)</text><rect x="170" y="420" width="260" height="300" rx="8" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><rect x="470" y="400" width="280" height="180" rx="8" fill="white" stroke="#28251f" stroke-width="5"/><line x1="520" y1="500" x2="660" y2="560" stroke="#aa8438" stroke-width="4" marker-end="url(#ah)"/><text x="300" y="790" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">lid lifts off — it can be</text><text x="300" y="825" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">set aside and lost</text><rect x="840" y="260" width="700" height="760" rx="18" fill="white" stroke="#d8d2c6" stroke-width="3"/><text x="870" y="315" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">BOOKLET BOX — CLOSED</text><rect x="960" y="430" width="460" height="290" rx="8" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><line x1="960" y1="430" x2="960" y2="720" stroke="#aa8438" stroke-width="8"/><text x="1190" y="790" font-size="26" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">spine = hinge line</text><text x="1190" y="830" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">front cover rotates away</text><rect x="1580" y="260" width="720" height="760" rx="18" fill="white" stroke="#d8d2c6" stroke-width="3"/><text x="1610" y="315" font-size="34" font-weight="700" fill="#28251f" font-family="Arial">BOOKLET BOX — OPEN</text><rect x="1650" y="450" width="280" height="240" rx="6" fill="white" stroke="#28251f" stroke-width="5"/><rect x="1930" y="450" width="280" height="240" rx="6" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><line x1="1930" y1="450" x2="1930" y2="690" stroke="#aa8438" stroke-width="8"/><rect x="1690" y="490" width="200" height="160" fill="none" stroke="#6f675a" stroke-width="3" stroke-dasharray="8 6"/><text x="1790" y="760" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">product cavity + page sleeve</text><text x="2070" y="760" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">printed liner interior</text><text x="1940" y="830" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">opens like a book — media-kit interior</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>