<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Timeline of the EU packaging regulation from entry into force in February 2025 to the 2030 empty-space duty">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">PPWR milestones a buyer plans against</text>
  <line x1="120" y1="330" x2="1080" y2="330" stroke="#b08d46" stroke-width="2"/>
  <circle cx="170" cy="330" r="7" fill="#b08d46"/>
  <text x="170" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="middle" font-weight="bold">Feb 2025</text>
  <text x="170" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">In force</text>
  <text x="170" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#18120c" text-anchor="middle" font-weight="normal">Regulation (EU) 2025/40</text>
  <circle cx="430" cy="330" r="7" fill="#b08d46"/>
  <text x="430" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="middle" font-weight="bold">Aug 2026</text>
  <text x="430" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Applies</text>
  <text x="430" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#18120c" text-anchor="middle" font-weight="normal">repeals Directive 94/62/EC</text>
  <circle cx="700" cy="330" r="7" fill="#b08d46"/>
  <text x="700" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="middle" font-weight="bold">Phase-in</text>
  <text x="700" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Grading</text>
  <text x="700" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#18120c" text-anchor="middle" font-weight="normal">recyclability grades by category</text>
  <circle cx="970" cy="330" r="7" fill="#b08d46"/>
  <text x="970" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="middle" font-weight="bold">2030</text>
  <text x="970" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Empty space</text>
  <text x="970" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#18120c" text-anchor="middle" font-weight="normal">≤50% empty-space ratio duty</text>
  <text x="600" y="635" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">The deadlines are procurement dates — empty-space and recyclability duties change box specifications, not just filings.</text>
</svg>
