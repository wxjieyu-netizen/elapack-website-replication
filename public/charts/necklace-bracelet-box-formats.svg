<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three necklace and bracelet box formats">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Three formats, one rule: the chain decides the box</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Pendant, long necklace and bracelet boxes each hold a different length — the box is chosen after the chain</text>
<rect x="90" y="120" width="320" height="360" rx="6" fill="#18120c"/>
<text x="250.0" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#faf9f7">Pendant box</text>
<text x="250.0" y="186" text-anchor="middle" font-size="12" fill="#b08d46">square, small</text>
<text x="250.0" y="210" text-anchor="middle" font-size="12" fill="#faf9f7">short chain or pendant only</text>
<text x="250.0" y="236" text-anchor="middle" font-size="12.5" fill="#b08d46">catalogue example 64 × 64 mm</text>
<text x="250.0" y="260" text-anchor="middle" font-size="11.5" fill="#6b6258">(Westpack Oslo earring / small pendant)</text>
<text x="250.0" y="300" text-anchor="middle" font-size="12" fill="#faf9f7">chain tab optional</text>
<text x="250.0" y="322" text-anchor="middle" font-size="11.5" fill="#6b6258">short lengths fold once</text>
<rect x="430" y="120" width="340" height="360" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/>
<text x="600.0" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Long necklace box</text>
<text x="600.0" y="186" text-anchor="middle" font-size="12" fill="#6b6258">square or wide</text>
<text x="600.0" y="210" text-anchor="middle" font-size="12" fill="#18120c">long chain, chain tabs to control it</text>
<text x="600.0" y="236" text-anchor="middle" font-size="12.5" fill="#b08d46">catalogue example 160 × 160 × 34 mm</text>
<text x="600.0" y="260" text-anchor="middle" font-size="11.5" fill="#6b6258">(Westpack Oslo necklace)</text>
<text x="600.0" y="300" text-anchor="middle" font-size="12" fill="#18120c">chain tabs required</text>
<text x="600.0" y="322" text-anchor="middle" font-size="11.5" fill="#6b6258">necklaces and pendants need chain control</text>
<rect x="790" y="120" width="320" height="360" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/>
<text x="950.0" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#18120c">Bracelet box</text>
<text x="950.0" y="186" text-anchor="middle" font-size="12" fill="#6b6258">narrow, long</text>
<text x="950.0" y="210" text-anchor="middle" font-size="12" fill="#18120c">bangle, cuff or charm bracelet</text>
<text x="950.0" y="236" text-anchor="middle" font-size="12.5" fill="#b08d46">catalogue example 219 × 55 × 41 mm</text>
<text x="950.0" y="260" text-anchor="middle" font-size="11.5" fill="#6b6258">(Westpack Madrid bracelet)</text>
<text x="950.0" y="300" text-anchor="middle" font-size="12" fill="#18120c">longer insert, no chain tab</text>
<text x="950.0" y="322" text-anchor="middle" font-size="11.5" fill="#6b6258">interior length and support do the work</text>
<text x="60" y="646" font-size="11.5" fill="#6b6258">Dimensions are Westpack catalogue values as published, quoted for comparison — not this factory's stock specification.</text>
</g>
</svg>
