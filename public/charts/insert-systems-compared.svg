<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four insert systems compared: die-cut EVA foam, recyclable paper cavities, layered board and printed insert cards, with positioning and cost">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Four systems, one cavity drawing</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Choose by product weight, fragility and how the piece is lifted out</text>
    <g font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#18120c">
      <rect x="24" y="78" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="106" text-anchor="middle" fill="#faf9f7">Recyclable paper</text>
      <text x="114" y="126" text-anchor="middle" fill="#b08d46" font-size="11">die-cut cavities, platforms</text>
      <line x1="204" y1="110" x2="254" y2="110" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="105">Light pieces, sets</text>
      <text x="266" y="124" fill="#6b6258" font-size="11.5">recyclable default · value cost</text>

      <rect x="24" y="162" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="190" text-anchor="middle" fill="#faf9f7">EVA / PET / PE foam</text>
      <text x="114" y="210" text-anchor="middle" fill="#b08d46" font-size="11">sculpted to the piece</text>
      <line x1="204" y1="194" x2="254" y2="194" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="189">Heavy, fragile, high-value</text>
      <text x="266" y="208" fill="#6b6258" font-size="11.5">highest hold · premium cost</text>

      <rect x="24" y="246" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="274" text-anchor="middle" fill="#faf9f7">Layered 2 mm board</text>
      <text x="114" y="294" text-anchor="middle" fill="#b08d46" font-size="11">stacked build-up</text>
      <line x1="204" y1="278" x2="254" y2="278" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="273">Sculpted look</text>
      <text x="266" y="292" fill="#6b6258" font-size="11.5">up to 40% space and cost saved</text>

      <rect x="24" y="330" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="358" text-anchor="middle" fill="#faf9f7">Insert card</text>
      <text x="114" y="378" text-anchor="middle" fill="#b08d46" font-size="11">printed, slots into the fitment</text>
      <line x1="204" y1="362" x2="254" y2="362" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="357">Care and message cards</text>
      <text x="266" y="376" fill="#6b6258" font-size="11.5">specified with the slot, not after it</text>
    </g>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Systems per ELAPACK published ranges; the 40% layered-board saving is an ELAPACK published figure.</text>
  </g>
</svg>
