<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Finish decision tree from the logo artwork to emboss, foil, spot UV or lamination">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Start from the logo, not the catalogue</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">The artwork decides which finishes are even possible</text>
    <g font-family="Helvetica,Arial,sans-serif">
      <!-- logo root -->
      <rect x="24" y="184" width="150" height="60" rx="8" fill="#18120c"/>
      <text x="99" y="209" text-anchor="middle" font-size="13" fill="#faf9f7">The logo</text>
      <text x="99" y="227" text-anchor="middle" font-size="10.5" fill="#b08d46">vector artwork, Pantone</text>

      <!-- branches -->
      <line x1="174" y1="196" x2="252" y2="104" stroke="#b08d46" stroke-width="1.5"/>
      <line x1="174" y1="214" x2="252" y2="214" stroke="#b08d46" stroke-width="1.5"/>
      <line x1="174" y1="232" x2="252" y2="318" stroke="#b08d46" stroke-width="1.5"/>

      <!-- what is it pressed into -->
      <rect x="252" y="72" width="210" height="64" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <text x="357" y="97" text-anchor="middle" font-size="12.5" fill="#18120c">Pressed into the board?</text>
      <text x="357" y="117" text-anchor="middle" font-size="11" fill="#6b6258">emboss (raised) · deboss (pressed)</text>

      <!-- what carries the shine -->
      <rect x="252" y="182" width="210" height="64" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <text x="357" y="207" text-anchor="middle" font-size="12.5" fill="#18120c">Carries the shine?</text>
      <text x="357" y="227" text-anchor="middle" font-size="11" fill="#6b6258">foil stamping · spot UV</text>

      <!-- what protects the wrap -->
      <rect x="252" y="286" width="210" height="64" rx="6" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <text x="357" y="311" text-anchor="middle" font-size="12.5" fill="#18120c">Protects the wrap?</text>
      <text x="357" y="331" text-anchor="middle" font-size="11" fill="#6b6258">lamination — matte, gloss, soft-touch</text>

      <!-- outcomes -->
      <line x1="462" y1="104" x2="510" y2="104" stroke="#b08d46" stroke-width="1.5"/>
      <text x="520" y="100" font-size="12" fill="#18120c">die pair, artwork-specific tooling</text>
      <text x="520" y="117" font-size="11" fill="#6b6258">approve by touch on the real wrap</text>

      <line x1="462" y1="214" x2="510" y2="214" stroke="#b08d46" stroke-width="1.5"/>
      <text x="520" y="210" font-size="12" fill="#18120c">foil needs vector paths; UV reads against matte</text>
      <text x="520" y="227" font-size="11" fill="#6b6258">set-up vs per-unit cost trade-off</text>

      <line x1="462" y1="318" x2="510" y2="318" stroke="#b08d46" stroke-width="1.5"/>
      <text x="520" y="314" font-size="12" fill="#18120c">choose lamination first, accents second</text>
      <text x="520" y="331" font-size="11" fill="#6b6258">film changes how the same Pantone reads</text>
    </g>
    <text x="24" y="392" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">Combinations — foil over deboss, spot UV on matte — are approved once, assembled, on the custom sample.</text>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Finish mechanics as published by printing authorities; combinations approved on the USD 25 custom sample, 3–5 day build.</text>
  </g>
</svg>
