<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Judging a colour mismatch in the right order">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Judging a colour mismatch in the right order</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Four gates in sequence — skip one and the argument lands on the wrong component</text>
<rect x="30.0" y="150" width="240.0" height="170" rx="6" fill="#18120c"/><text x="150.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Identifiable references</text><text x="150.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">every component carries a</text><text x="150.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">swatch or code — no judging</text><text x="150.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">from memory</text><line x1="276.0" y1="235.0" x2="318.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M324.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="330.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="450.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Agreed lighting</text><text x="450.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">same light box or daylight</text><text x="450.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">condition for buyer and</text><text x="450.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">supplier</text><line x1="576.0" y1="235.0" x2="618.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M624.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="630.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="750.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Compare as a set</text><text x="750.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">box, pouch and ribbon judged</text><text x="750.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">together, not piece by</text><text x="750.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">piece</text><line x1="876.0" y1="235.0" x2="918.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M924.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="930.0" y="150" width="240.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1050.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Written acceptance</text><text x="1050.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">what "acceptable" means:</text><text x="1050.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">side-by-side, at arm's</text><text x="1050.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">length, under the agreed light</text></g>
</svg>
