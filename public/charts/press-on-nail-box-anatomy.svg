<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">A press-on nail box is specified from the tray outward</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Two published depth tiers, one cause — flat adhesive tabs stack at ~15 mm; a glue tube pushes the kit to ~25 mm</text>
