<text x="900" y="488" text-anchor="middle" font-size="11.5" fill="#6b6258">glue tube and tools ride along</text>
<text x="60" y="640" font-size="11.5" fill="#6b6258">Illustrative proportions — depth tiers, tube dimensions and film gauges as published by the sources cited in the article; not ELAPACK specifications.</text>
