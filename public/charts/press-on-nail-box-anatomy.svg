<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cross-section of a press-on nail box: the tray sets the footprint and the adhesive sets the depth tier">
<rect width="1200" height="675" fill="#faf9f7"/>
