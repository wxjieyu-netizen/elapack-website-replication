<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four sample-card formats and their typical programmes">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(47.727 0) scale(1.53409)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Four formats, four programmes</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Format choice follows the use context in the artwork brief</text>
    <g font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#18120c">
      <rect x="24" y="78" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="106" text-anchor="middle" fill="#faf9f7">Blotter strips</text>
      <text x="114" y="126" text-anchor="middle" fill="#b08d46" font-size="11">one scent per strip</text>
      <line x1="204" y1="110" x2="254" y2="110" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="105">Counter blocks</text>
      <text x="266" y="124" fill="#6b6258" font-size="11.5">launch handouts, single-scent tests</text>

      <rect x="24" y="162" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="190" text-anchor="middle" fill="#faf9f7">Standard cards</text>
      <text x="114" y="210" text-anchor="middle" fill="#b08d46" font-size="11">folded or flat</text>
      <line x1="204" y1="194" x2="254" y2="194" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="189">Discovery sets</text>
      <text x="266" y="208" fill="#6b6258" font-size="11.5">multi-scent rows, mailers</text>

      <rect x="24" y="246" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="274" text-anchor="middle" fill="#faf9f7">Wallet-size cards</text>
      <text x="114" y="294" text-anchor="middle" fill="#b08d46" font-size="11">85.60 × 53.98 mm</text>
      <line x1="204" y1="278" x2="254" y2="278" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="273">Catalogues</text>
      <text x="266" y="292" fill="#6b6258" font-size="11.5">envelopes, counter stacks</text>

      <rect x="24" y="330" width="180" height="64" rx="6" fill="#18120c"/>
      <text x="114" y="358" text-anchor="middle" fill="#faf9f7">Vial-on-card</text>
      <text x="114" y="378" text-anchor="middle" fill="#b08d46" font-size="11">vial mounted, card kept</text>
      <line x1="204" y1="362" x2="254" y2="362" stroke="#b08d46" stroke-width="1.5"/>
      <text x="266" y="357">Press mailers</text>
      <text x="266" y="376" fill="#6b6258" font-size="11.5">GWP counters, keep-the-card sampling</text>
    </g>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Sizes and formats per ELAPACK product specifications; wallet size = ISO/IEC 7810 ID-1.</text>
  </g>
</svg>
