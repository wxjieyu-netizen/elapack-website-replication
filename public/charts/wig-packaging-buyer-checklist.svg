<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Wig packaging buyer checklist</title>
  <desc id="desc">Measure the packed wig, compare bag or box options, and check a loaded sample before ordering.</desc>
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="80" fill="#8b6d36" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">ELAPACK · BUYER CHECKLIST</text>
  <text x="60" y="155" fill="#201b17" font-family="Georgia,serif" font-size="48">Start with the actual wig</text>
  <text x="60" y="205" fill="#5e5851" font-family="Arial,sans-serif" font-size="22">Compare the packaging after you know the packed contents and selling route.</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="265" width="330" height="260" rx="8" fill="#fff" stroke="#d8d1c5"/>
    <text x="85" y="315" fill="#a67d35" font-size="28">01</text>
    <text x="85" y="360" fill="#201b17" font-size="26" font-weight="bold">Packed wig</text>
    <text x="85" y="402" fill="#5e5851" font-size="19">Measure length, width and depth</text>
    <text x="85" y="433" fill="#5e5851" font-size="19">with cap, net, tags and any</text>
    <text x="85" y="464" fill="#5e5851" font-size="19">accessories in place.</text>
    <rect x="435" y="265" width="330" height="260" rx="8" fill="#fff" stroke="#d8d1c5"/>
    <text x="460" y="315" fill="#a67d35" font-size="28">02</text>
    <text x="460" y="360" fill="#201b17" font-size="26" font-weight="bold">Bag or box</text>
    <text x="460" y="402" fill="#5e5851" font-size="19">Compare usable space, contact</text>
    <text x="460" y="433" fill="#5e5851" font-size="19">surfaces, opening and how the</text>
    <text x="460" y="464" fill="#5e5851" font-size="19">customer receives it.</text>
    <rect x="810" y="265" width="330" height="260" rx="8" fill="#fff" stroke="#d8d1c5"/>
    <text x="835" y="315" fill="#a67d35" font-size="28">03</text>
    <text x="835" y="360" fill="#201b17" font-size="26" font-weight="bold">Loaded sample</text>
    <text x="835" y="402" fill="#5e5851" font-size="19">Check closure, removal, seams</text>
    <text x="835" y="433" fill="#5e5851" font-size="19">and artwork on the proposed</text>
    <text x="835" y="464" fill="#5e5851" font-size="19">construction.</text>
  </g>
  <line x1="60" y1="575" x2="1140" y2="575" stroke="#d8d1c5"/>
  <text x="60" y="615" fill="#5e5851" font-family="Arial,sans-serif" font-size="18">Illustrative specification steps · not a fit or transport performance test</text>
  <text x="1140" y="615" text-anchor="end" fill="#8b6d36" font-family="Arial,sans-serif" font-size="18">elapack.com</text>
</svg>
