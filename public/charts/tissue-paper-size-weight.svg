<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<rect width="1200" height="675" fill="#faf9f7"/>
<text x="60" y="70" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#18120c">Tissue paper: sheet size and paper weight</text>
<text x="60" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b6258">Both are specified for your project and confirmed on a physical sample — no standard sheet fits every box.</text>

<!-- sheet -->
<g>
  <rect x="110" y="190" width="480" height="340" fill="#ffffff" stroke="#18120c" stroke-width="2"/>
  <polygon points="590,530 530,530 590,470" fill="#efe9df" stroke="#18120c" stroke-width="1.5"/>
  <line x1="230" y1="190" x2="230" y2="530" stroke="#b08d46" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="410" y1="190" x2="410" y2="530" stroke="#b08d46" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="350" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle">dashed lines: fold sequence over the product</text>
  <!-- L arrow (top) -->
  <line x1="110" y1="160" x2="590" y2="160" stroke="#18120c" stroke-width="1.5"/>
  <polygon points="110,160 124,154 124,166" fill="#18120c"/>
  <polygon points="590,160 576,154 576,166" fill="#18120c"/>
  <text x="350" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#18120c" text-anchor="middle">L — sheet length</text>
  <!-- W arrow (left) -->
  <line x1="80" y1="190" x2="80" y2="530" stroke="#18120c" stroke-width="1.5"/>
  <polygon points="80,190 74,204 86,204" fill="#18120c"/>
  <polygon points="80,530 74,516 86,516" fill="#18120c"/>
  <text x="52" y="365" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#18120c" text-anchor="middle" transform="rotate(-90 52 365)">W — sheet width</text>
</g>

<!-- callouts -->
<g font-family="Helvetica, Arial, sans-serif">
  <circle cx="690" cy="216" r="5" fill="#b08d46"/>
  <text x="712" y="222" font-size="16" font-weight="bold" fill="#18120c">Sheet size</text>
  <text x="712" y="248" font-size="14" fill="#6b6258">Tailored to your box interior and folding sequence,</text>
  <text x="712" y="270" font-size="14" fill="#6b6258">so the wrap closes cleanly without bulky corners.</text>

  <circle cx="690" cy="336" r="5" fill="#b08d46"/>
  <text x="712" y="342" font-size="16" font-weight="bold" fill="#18120c">Paper weight (GSM)</text>
  <text x="712" y="368" font-size="14" fill="#6b6258">Weight per area only — it does not by itself decide</text>
  <text x="712" y="390" font-size="14" fill="#6b6258">print sharpness or surface protection.</text>

  <circle cx="690" cy="456" r="5" fill="#b08d46"/>
  <text x="712" y="462" font-size="16" font-weight="bold" fill="#18120c">Sample checks</text>
  <text x="712" y="488" font-size="14" fill="#6b6258">Print registration, hand-feel, folding behaviour and ink</text>
  <text x="712" y="510" font-size="14" fill="#6b6258">transfer are verified on the actual sheet before bulk.</text>
</g>
</svg>