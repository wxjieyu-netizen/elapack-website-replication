<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A gift pack is three layered decisions">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">A gift pack is three layered decisions</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Outer structure, inner protection and the finish layer — briefed together, because each changes the other two</text>
<circle cx="88" cy="186.0" r="20" fill="#18120c"/><text x="88" y="191.0" text-anchor="middle" font-size="15" fill="#faf9f7">1</text><rect x="130" y="140" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Outer structure</text><text x="635.0" y="192" text-anchor="middle" font-size="11.5" fill="#6b6258">rigid box, folding carton or bag — set by weight, fragility</text><text x="635.0" y="209" text-anchor="middle" font-size="11.5" fill="#6b6258">and the unboxing moment</text><circle cx="88" cy="296.0" r="20" fill="#18120c"/><text x="88" y="301.0" text-anchor="middle" font-size="15" fill="#faf9f7">2</text><rect x="130" y="250" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Insert and protection</text><text x="635.0" y="302" text-anchor="middle" font-size="11.5" fill="#6b6258">molded pulp, foam, fabric-wrapped platform — holds the</text><text x="635.0" y="319" text-anchor="middle" font-size="11.5" fill="#6b6258">product in place through transit</text><circle cx="88" cy="406.0" r="20" fill="#18120c"/><text x="88" y="411.0" text-anchor="middle" font-size="15" fill="#faf9f7">3</text><rect x="130" y="360" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Finish layer</text><text x="635.0" y="412" text-anchor="middle" font-size="11.5" fill="#6b6258">wrap paper, ribbon, seal, card — the layer the recipient</text><text x="635.0" y="429" text-anchor="middle" font-size="11.5" fill="#6b6258">touches first</text></g>
</svg>
