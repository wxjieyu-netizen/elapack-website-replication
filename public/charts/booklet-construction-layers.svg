<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Booklet box construction: the layers and the four structural decisions</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">Same wrapped-greyboard system as the rigid box line — the booklet is a configuration, not a new material</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="160" y="420" width="900" height="90" rx="10" fill="#f1ece2" stroke="#28251f" stroke-width="4"/><text x="190" y="477" font-size="26" fill="#28251f" font-family="Arial">Cover wrap — printed paper, cloth, or foil-stamped finish</text><rect x="160" y="580" width="900" height="90" rx="10" fill="white" stroke="#28251f" stroke-width="4"/><text x="190" y="637" font-size="26" fill="#28251f" font-family="Arial">Greyboard — wrapped and glued</text><rect x="160" y="740" width="900" height="90" rx="10" fill="#f1ece2" stroke="#28251f" stroke-width="4"/><text x="190" y="797" font-size="26" fill="#28251f" font-family="Arial">Inner liner — flat printed card is the cheapest interior</text><rect x="160" y="900" width="900" height="90" rx="10" fill="white" stroke="#28251f" stroke-width="4"/><text x="190" y="957" font-size="26" fill="#28251f" font-family="Arial">Fitment — recessed cavity, moulded insert or sponge adds tooling</text><text x="610" y="1070" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">wall build (exploded view)</text><rect x="1180" y="300" width="1120" height="180" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="1180" y="300" width="12" height="180" rx="6" fill="#aa8438"/><text x="1230" y="362" font-size="32" font-weight="700" fill="#28251f" font-family="Arial">Spine width</text><text x="1230" y="410" font-size="25" fill="#6f675a" font-family="Arial">narrow spine = single cavity · wide spine = double-page</text><text x="1230" y="446" font-size="25" fill="#6f675a" font-family="Arial">interior; quotes are not comparable unless spines match</text><rect x="1180" y="510" width="1120" height="180" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="1180" y="510" width="12" height="180" rx="6" fill="#aa8438"/><text x="1230" y="572" font-size="32" font-weight="700" fill="#28251f" font-family="Arial">Hinge construction</text><text x="1230" y="620" font-size="25" fill="#6f675a" font-family="Arial">wrapped paper · cloth-reinforced · mechanical element — feel</text><text x="1230" y="656" font-size="25" fill="#6f675a" font-family="Arial">and cycle life differ; confirm on the sample</text><rect x="1180" y="720" width="1120" height="180" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="1180" y="720" width="12" height="180" rx="6" fill="#aa8438"/><text x="1230" y="782" font-size="32" font-weight="700" fill="#28251f" font-family="Arial">Cover finish</text><text x="1230" y="830" font-size="25" fill="#6f675a" font-family="Arial">wrap, lamination, foil, embossing change cost and appearance,</text><text x="1230" y="866" font-size="25" fill="#6f675a" font-family="Arial">not structure</text><rect x="1180" y="930" width="1120" height="180" rx="14" fill="white" stroke="#d8d2c6" stroke-width="3"/><rect x="1180" y="930" width="12" height="180" rx="6" fill="#aa8438"/><text x="1230" y="992" font-size="32" font-weight="700" fill="#28251f" font-family="Arial">Grain direction</text><text x="1230" y="1040" font-size="25" fill="#6f675a" font-family="Arial">paper grain normally runs parallel to the spine; cross-grain</text><text x="1230" y="1076" font-size="25" fill="#6f675a" font-family="Arial">is associated with hinge cracking and warping</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>