<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Funnel diagram showing supplier vetting as three gates: documents, custom sample, and controlled first order">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">Vetting a packaging manufacturer: three gates</text>
  <path d="M 150 130 h 900 l -60 90 h -780 z" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="600" y="168" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#18120c" text-anchor="middle" font-weight="bold">Gate 1 · Documents</text>
  <text x="600" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="middle" font-weight="normal">business licence · ISO 9001 scope · export record · references</text>
  <path d="M 270 245 h 660 l -60 90 h -540 z" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="600" y="283" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#18120c" text-anchor="middle" font-weight="bold">Gate 2 · Sample</text>
  <text x="600" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="middle" font-weight="normal">paid custom sample to your dieline — workmanship in hand</text>
  <path d="M 390 360 h 420 l -60 90 h -300 z" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="600" y="398" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#18120c" text-anchor="middle" font-weight="bold">Gate 3 · First order</text>
  <text x="600" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6258" text-anchor="middle" font-weight="normal">minimum quantity, approved sample on file, inspected before ship</text>
  <text x="600" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">Shortlist → documents → sample → first order: each gate costs less than the mistake it prevents.</text>
  <text x="600" y="610" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b08d46" text-anchor="middle" font-weight="normal">A factory that hesitates at gate one has answered gate three.</text>
</svg>
