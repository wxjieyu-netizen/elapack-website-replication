<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three formats, three jobs in a hair program">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Three formats, three jobs in a hair program</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The retail presentation, the bundle carrier and the shipping outer are separate decisions — one piece rarely does all three</text>
<rect x="60" y="130" width="280" height="200" rx="6" fill="#18120c"/><text x="200.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Retail box or sleeve</text><text x="200.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">hangs or stacks on shelf, holds</text><text x="200.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">the weft bundles visible</text><text x="200.0" y="216" text-anchor="middle" font-size="11.5" fill="#b08d46">with a window or print</text><rect x="460" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Header-card pouch</text><text x="600.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">bundle in a clear or printed</text><text x="600.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">pouch on a branded card —</text><text x="600.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">the workhorse of extension lines</text><rect x="860" y="130" width="280" height="200" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Shipping outer</text><text x="1000.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">mailer or carton that carries</text><text x="1000.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">the retail pieces to the</text><text x="1000.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">customer undamaged</text></g>
</svg>
