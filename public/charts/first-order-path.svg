<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The first-order path: stock sample, custom sample, first order — and what each stage locks in">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(60 28) scale(1.45)" font-family="Helvetica,Arial,sans-serif">
    <text x="24" y="22" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">First order: what each stage locks in</text>
    <text x="24" y="40" font-size="11" fill="#6b6258">Sequence beats size — a small verifiable order teaches more than a big blind one</text>

    <g>
      <rect x="24" y="72" width="196" height="150" rx="6" fill="#18120c"/>
      <text x="122" y="100" text-anchor="middle" font-size="13" fill="#faf9f7">1 · Stock sample</text>
      <text x="122" y="118" text-anchor="middle" font-size="11" fill="#b08d46">free · ships 2–3 days · +USD 20 courier</text>
      <text x="122" y="146" text-anchor="middle" font-size="11" fill="#faf9f7">settles board feel, fabric hand</text>
      <text x="122" y="162" text-anchor="middle" font-size="11" fill="#faf9f7">and print quality — before artwork</text>
      <text x="122" y="196" text-anchor="middle" font-size="10.5" fill="#d8cba9">locks: the materials</text>

      <rect x="262" y="72" width="196" height="150" rx="6" fill="#3d3227"/>
      <text x="360" y="100" text-anchor="middle" font-size="13" fill="#faf9f7">2 · Custom sample</text>
      <text x="360" y="118" text-anchor="middle" font-size="11" fill="#b08d46">USD 25 + 20 · built 3–5 days</text>
      <text x="360" y="146" text-anchor="middle" font-size="11" fill="#faf9f7">proves print, colour and</text>
      <text x="360" y="162" text-anchor="middle" font-size="11" fill="#faf9f7">construction on your dieline</text>
      <text x="360" y="196" text-anchor="middle" font-size="10.5" fill="#d8cba9">locks: the artwork</text>

      <rect x="500" y="72" width="196" height="150" rx="6" fill="#6b6258"/>
      <text x="598" y="100" text-anchor="middle" font-size="13" fill="#faf9f7">3 · First order</text>
      <text x="598" y="118" text-anchor="middle" font-size="11" fill="#d8cba9">200 pcs · 15–20 working days</text>
      <text x="598" y="146" text-anchor="middle" font-size="11" fill="#faf9f7">tiered prices, dieline ownership</text>
      <text x="598" y="162" text-anchor="middle" font-size="11" fill="#faf9f7">and pack format in writing</text>
      <text x="598" y="196" text-anchor="middle" font-size="10.5" fill="#efe6d2">locks: the programme</text>
    </g>

    <g stroke="#b08d46" stroke-width="2" fill="#b08d46">
      <line x1="222" y1="147" x2="254" y2="147"/>
      <path d="M 258 147 l -9 -4.5 v 9 z"/>
      <line x1="460" y1="147" x2="492" y2="147"/>
      <path d="M 496 147 l -9 -4.5 v 9 z"/>
    </g>

    <path d="M 598 226 C 598 278, 122 278, 122 232" fill="none" stroke="#6b6258" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 122 227 l -4.5 9 h 9 z" fill="#6b6258"/>
    <text x="360" y="300" text-anchor="middle" font-size="11" fill="#6b6258">re-order: same dieline, next tier, no tooling re-paid — the artwork is already approved</text>

    <text x="24" y="344" font-size="11" fill="#6b6258">Sample approval + deposit start the production clock — the sample round, not the production window, is where first orders lose time.</text>
    <text x="24" y="362" font-size="11" fill="#6b6258">Budget = unit price × quantity + one-off tooling (USD 50–100 cutting die where needed) + freight.</text>
  </g>
</svg>
