<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cross-section of a jewelry box insert: covering fabric over a foam core, cavities cut into the core, and the optional anti-tarnish treatment carried by the covering">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">A box insert in cross-section — four stacked decisions</text>
<text x="60" y="78" font-size="13" fill="#6b6258">The covering sits on the core, the cavity is cut into the core, and the anti-tarnish treatment — when specified — belongs to the covering</text>

<rect x="90" y="140" width="28" height="330" fill="#3a332b"/>
<rect x="662" y="140" width="28" height="330" fill="#3a332b"/>
<rect x="90" y="442" width="600" height="28" fill="#3a332b"/>

<path d="M118,172 H210 V300 H280 V172 H380 V250 H600 V172 H662 V442 H118 Z" fill="#e6dcc8" stroke="#b08d46" stroke-width="1"/>

<path d="M118,168 H210 V296 H280 V168 H380 V246 H600 V168 H662" fill="none" stroke="#18120c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M118,168 H210 V296 H280 V168 H380 V246 H600 V168 H662" fill="none" stroke="#b08d46" stroke-width="2.5" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/>

<text x="245" y="326" text-anchor="middle" font-size="11.5" fill="#6b6258">ring slot</text>
<text x="490" y="276" text-anchor="middle" font-size="11.5" fill="#6b6258">pendant recess</text>

<line x1="118" y1="512" x2="178" y2="512" stroke="#18120c" stroke-width="6" stroke-linecap="round"/>
<text x="192" y="516" font-size="11.5" fill="#6b6258">fabric-covered edge — layers 1 and 2</text>
<line x1="118" y1="544" x2="178" y2="544" stroke="#b08d46" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/>
<text x="192" y="548" font-size="11.5" fill="#6b6258">anti-tarnish treatment of the same fabric — optional</text>

<line x1="740" y1="245" x2="1140" y2="245" stroke="#e0e0e0" stroke-width="1"/>
<line x1="740" y1="367" x2="1140" y2="367" stroke="#e0e0e0" stroke-width="1"/>
<line x1="740" y1="489" x2="1140" y2="489" stroke="#e0e0e0" stroke-width="1"/>

<circle cx="770" cy="170" r="16" fill="#18120c"/><text x="770" y="175.5" text-anchor="middle" font-size="14" fill="#faf9f7">1</text>
<text x="800" y="176" font-size="15" font-weight="600" fill="#18120c">Covering fabric</text>
<text x="800" y="198" font-size="11.5" fill="#6b6258">velvet, leatherette, flannel or suede —</text>
<text x="800" y="214" font-size="11.5" fill="#6b6258">the surface that touches the metal</text>

<circle cx="770" cy="292" r="16" fill="#18120c"/><text x="770" y="297.5" text-anchor="middle" font-size="14" fill="#faf9f7">2</text>
<text x="800" y="298" font-size="15" font-weight="600" fill="#18120c">Core</text>
<text x="800" y="320" font-size="11.5" fill="#6b6258">foam (EVA) cut to the product footprint;</text>
<text x="800" y="336" font-size="11.5" fill="#6b6258">the covering bonds over it — never left bare</text>

<circle cx="770" cy="414" r="16" fill="#18120c"/><text x="770" y="419.5" text-anchor="middle" font-size="14" fill="#faf9f7">3</text>
<text x="800" y="420" font-size="15" font-weight="600" fill="#18120c">Cavity layout</text>
<text x="800" y="442" font-size="11.5" fill="#6b6258">slot, groove or recess cut into the core</text>
<text x="800" y="458" font-size="11.5" fill="#6b6258">to the dimensions of the piece</text>

<circle cx="770" cy="536" r="16" fill="none" stroke="#6b6258" stroke-width="1" stroke-dasharray="4 3"/><text x="770" y="541.5" text-anchor="middle" font-size="14" fill="#6b6258">4</text>
<text x="800" y="542" font-size="15" font-weight="600" fill="#18120c">Anti-tarnish treatment <tspan fill="#b08d46" font-weight="400">(optional)</tspan></text>
<text x="800" y="564" font-size="11.5" fill="#6b6258">a treatment carried by the covering, not a</text>
<text x="800" y="580" font-size="11.5" fill="#6b6258">separate sheet below it; saturates over years</text>

<text x="60" y="630" font-size="11.5" fill="#6b6258">Layers 1–3 are this factory's standard insert build. Layer 4 is a treatment of layer 1, quoted per enquiry — not a separate sheet and not a default claim.</text>
<text x="60" y="652" font-size="11.5" fill="#6b6258">Walls and base are drawn for context only; the insert sits recessed inside the rigid box.</text>
</g>
</svg>
