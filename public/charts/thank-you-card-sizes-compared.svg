<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Thank you card sizes A1, A2, A6, A7 and 6x6 square drawn to scale, with envelope allowance and the scored fold rule for folded cards">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="64" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Thank you card sizes compared</text>
<text x="60" y="92" font-size="13" fill="#6b6258">All five formats drawn to one scale — cards are named by the envelope system they pair with; folded cards are quoted by finished size</text>

<!-- Left: five cards to scale (1 in = 32 px), bottom edges aligned at y=464 -->
<rect x="60" y="308" width="112" height="156" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<rect x="198" y="288" width="136" height="176" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<rect x="360" y="264" width="144" height="200" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<rect x="530" y="240" width="160" height="224" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<rect x="716" y="272" width="192" height="192" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>

<text x="116" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">A1 (4-bar)</text>
<text x="116" y="514" text-anchor="middle" font-size="12" fill="#18120c">3.5 × 4.875″</text>
<text x="116" y="533" text-anchor="middle" font-size="10.5" fill="#6b6258">envelope 3.625 × 5.125″</text>

<text x="266" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">A2</text>
<text x="266" y="514" text-anchor="middle" font-size="12" fill="#18120c">4.25 × 5.5″</text>
<text x="266" y="533" text-anchor="middle" font-size="10.5" fill="#6b6258">envelope 4.375 × 5.75″</text>

<text x="432" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">A6</text>
<text x="432" y="514" text-anchor="middle" font-size="12" fill="#18120c">4.5 × 6.25″</text>
<text x="432" y="533" text-anchor="middle" font-size="10.5" fill="#6b6258">envelope 4.75 × 6.5″</text>

<text x="610" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">A7</text>
<text x="610" y="514" text-anchor="middle" font-size="12" fill="#18120c">5 × 7″</text>
<text x="610" y="533" text-anchor="middle" font-size="10.5" fill="#6b6258">envelope 5.25 × 7.25″</text>

<text x="812" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">Square</text>
<text x="812" y="514" text-anchor="middle" font-size="12" fill="#18120c">6 × 6″</text>
<text x="812" y="533" text-anchor="middle" font-size="10.5" fill="#6b6258">square envelope, same system</text>

<text x="60" y="648" font-size="10.5" fill="#6b6258">Card and envelope dimensions per ecofriendlyprinter&#8217;s pairing table; 6 × 6 square per 4over4; drawn to one scale.</text>

<!-- Divider -->
<line x1="928" y1="115" x2="928" y2="650" stroke="#d9d4ca" stroke-width="1"/>

<!-- Right top: the scored-fold rule -->
<text x="1050" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">The folded-card rule</text>
<rect x="955" y="168" width="190" height="133" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<rect x="1050" y="168" width="95" height="133" fill="#b08d46" opacity="0.08"/>
<line x1="1050" y1="168" x2="1050" y2="301" stroke="#b08d46" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1050" y="326" text-anchor="middle" font-size="11.5" fill="#18120c">10 × 7″ sheet, scored at centre</text>
<text x="1050" y="346" text-anchor="middle" font-size="11.5" fill="#18120c">folds to a finished 5 × 7″ card</text>

<!-- Right bottom: envelope allowance -->
<text x="1050" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">Envelope allowance</text>
<rect x="969" y="418" width="162" height="207" fill="none" stroke="#6b6258" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="974" y="423" width="153" height="198" fill="#ffffff" stroke="#18120c" stroke-width="1.5"/>
<text x="1050" y="652" text-anchor="middle" font-size="11.5" fill="#18120c">envelope +1/8–1/4″ per side</text>
</g>
</svg>
