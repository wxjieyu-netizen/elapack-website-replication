<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cosmetic packaging decided from the product outward">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Cosmetic packaging decided from the product outward</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Product first, then the format split, then one spec baseline both formats are quoted against</text>
<rect x="30.0" y="150" width="340.0" height="170" rx="6" fill="#18120c"/><text x="200.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Start from the product</text><text x="200.0" y="202" text-anchor="middle" font-size="11.5" fill="#b08d46">dimensions, weight,</text><text x="200.0" y="219" text-anchor="middle" font-size="11.5" fill="#b08d46">fragility, spill risk —</text><text x="200.0" y="236" text-anchor="middle" font-size="11.5" fill="#b08d46">the brief's constants</text><line x1="376.0" y1="235.0" x2="418.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M424.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="430.0" y="150" width="340.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="600.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Box, pouch or set</text><text x="600.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">rigid or folding box for</text><text x="600.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">shelf, pouch for soft</text><text x="600.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">goods, sets combine both</text><line x1="776.0" y1="235.0" x2="818.0" y2="235.0" stroke="#b08d46" stroke-width="1.5"/><path d="M824.0 235.0 l-9 -5 v10 z" fill="#b08d46"/><rect x="830.0" y="150" width="340.0" height="170" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="1000.0" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">One spec baseline</text><text x="1000.0" y="202" text-anchor="middle" font-size="11.5" fill="#6b6258">quantities, samples and a</text><text x="1000.0" y="219" text-anchor="middle" font-size="11.5" fill="#6b6258">single specification every</text><text x="1000.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">quote answers</text></g>
</svg>
