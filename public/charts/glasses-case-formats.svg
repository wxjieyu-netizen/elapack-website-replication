<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Glasses case formats: soft pouch, flip-lid box with insert, hard shell — mapped to protection level">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(60 28) scale(1.45)" font-family="Helvetica,Arial,sans-serif">
    <text x="24" y="22" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Three formats, one protection decision</text>
    <text x="24" y="40" font-size="11" fill="#6b6258">"Custom" and "personalised" name the intent — hard shell, pouch or flip lid names the product</text>

    <g stroke="#18120c" stroke-width="1.5" fill="#f2e9dc">
      <!-- soft pouch: rounded body + drawstring -->
      <rect x="62" y="106" width="120" height="84" rx="26"/>
      <circle cx="102" cy="112" r="3.5" fill="none"/>
      <circle cx="142" cy="112" r="3.5" fill="none"/>
      <path d="M 102 112 q 20 -18 40 0" fill="none" stroke-dasharray="3 3"/>
      <!-- flip-lid box with insert -->
      <rect x="288" y="124" width="128" height="66"/>
      <rect x="288" y="102" width="128" height="22" fill="#e5d5b8"/>
      <rect x="304" y="140" width="46" height="34" fill="none" stroke-dasharray="4 3"/>
      <rect x="356" y="140" width="46" height="34" fill="none" stroke-dasharray="4 3"/>
      <!-- hard shell: clamshell -->
      <path d="M 520 136 a 62 34 0 0 1 124 0 z"/>
      <path d="M 520 140 a 62 34 0 0 0 124 0 z" fill="#e5d5b8"/>
      <circle cx="582" cy="138" r="3.5" fill="none"/>
    </g>
    <g font-size="12.5" fill="#18120c" text-anchor="middle">
      <text x="122" y="226" font-weight="600">soft pouch</text>
      <text x="122" y="244" font-size="10.5" fill="#6b6258">velvet · cotton · microfiber</text>
      <text x="122" y="260" font-size="10.5" fill="#6b6258">in-box protection, lens cleaning, GWP</text>
      <text x="122" y="282" font-size="10.5" fill="#b08d46">ours — from 200 pcs per design</text>

      <text x="352" y="226" font-weight="600">flip-lid box + insert</text>
      <text x="352" y="244" font-size="10.5" fill="#6b6258">magnetic or rigid, EVA / moulded insert</text>
      <text x="352" y="260" font-size="10.5" fill="#6b6258">retail presentation, gift sets, e-commerce</text>
      <text x="352" y="282" font-size="10.5" fill="#b08d46">ours — folded frames set the footprint</text>

      <text x="582" y="226" font-weight="600">hard shell</text>
      <text x="582" y="244" font-size="10.5" fill="#6b6258">injection-moulded or metal, hinged</text>
      <text x="582" y="260" font-size="10.5" fill="#6b6258">everyday carry, optical retail</text>
      <text x="582" y="282" font-size="10.5" fill="#6b6258">a different trade — not ours</text>
    </g>

    <line x1="24" y1="312" x2="696" y2="312" stroke="#b08d46" stroke-width="1.5"/>
    <path d="M 700 312 l -9 -4.5 v 9 z" fill="#b08d46"/>
    <text x="24" y="306" font-size="10.5" fill="#6b6258">less protection</text>
    <text x="696" y="306" text-anchor="end" font-size="10.5" fill="#6b6258">more protection</text>
    <text x="360" y="332" text-anchor="middle" font-size="11" fill="#6b6258">the protection level the glasses need picks the format — state which side of the hard-shell line you are on</text>

    <text x="24" y="372" font-size="11" fill="#6b6258">Pouch and box from 200 pieces per design · 15–20 working days · order both as one programme so colour and branding match.</text>
  </g>
</svg>
