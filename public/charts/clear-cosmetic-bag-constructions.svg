<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four clear cosmetic bag constructions compared — flat zip pouch, gusseted pouch, carry format and divided kit — each with its buyer task and what to confirm on the sample">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="48" y="46" font-family="Georgia,serif" font-size="17" font-weight="600" fill="#18120c">Four constructions, four different jobs</text>
  <text x="48" y="68" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6258">Design concepts to discuss — confirm availability, pattern and production method before approving artwork</text>

  <g font-family="Helvetica,Arial,sans-serif">
    <!-- cell 1: flat zip pouch -->
    <rect x="83" y="120" width="190" height="200" rx="10" fill="#e9eef2" stroke="#18120c" stroke-width="1.5"/>
    <line x1="95" y1="142" x2="257" y2="142" stroke="#b08d46" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="253" cy="142" r="6" fill="none" stroke="#b08d46" stroke-width="2"/>
    <text x="48" y="372" font-size="13.5" font-weight="600" fill="#18120c">Flat zip pouch</text>
    <text x="48" y="398" font-size="11" fill="#6b6258"><tspan x="48" dy="0">Small item presentation</tspan><tspan x="48" dy="16">or an inner layer</tspan></text>
    <text x="48" y="448" font-size="10.5" font-style="italic" fill="#6b6258">Confirm on the sample:</text>
    <text x="48" y="468" font-size="11" fill="#18120c"><tspan x="48" dy="0">Usable opening, closed height</tspan><tspan x="48" dy="16">and edge quality</tspan></text>

    <!-- cell 2: gusseted pouch -->
    <path d="M 374 120 L 358 138 L 358 302 L 374 320 Z" fill="#dde6ea" stroke="#18120c" stroke-width="1.5"/>
    <path d="M 534 120 L 550 138 L 550 302 L 534 320 Z" fill="#dde6ea" stroke="#18120c" stroke-width="1.5"/>
    <rect x="374" y="120" width="160" height="200" fill="#e9eef2" stroke="#18120c" stroke-width="1.5"/>
    <line x1="390" y1="138" x2="390" y2="302" stroke="#18120c" stroke-width="0.75" opacity="0.45"/>
    <line x1="518" y1="138" x2="518" y2="302" stroke="#18120c" stroke-width="0.75" opacity="0.45"/>
    <line x1="386" y1="142" x2="522" y2="142" stroke="#b08d46" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="324" y="372" font-size="13.5" font-weight="600" fill="#18120c">Gusseted pouch</text>
    <text x="324" y="398" font-size="11" fill="#6b6258"><tspan x="324" dy="0">Contents needing</tspan><tspan x="324" dy="16">a wider base</tspan></text>
    <text x="324" y="448" font-size="10.5" font-style="italic" fill="#6b6258">Confirm on the sample:</text>
    <text x="324" y="468" font-size="11" fill="#18120c"><tspan x="324" dy="0">Loaded stability and</tspan><tspan x="324" dy="16">closure clearance</tspan></text>

    <!-- cell 3: carry format -->
    <path d="M 675 170 C 675 125 715 125 715 170" fill="none" stroke="#b08d46" stroke-width="2.5"/>
    <path d="M 755 170 C 755 125 795 125 795 170" fill="none" stroke="#b08d46" stroke-width="2.5"/>
    <circle cx="675" cy="172" r="3" fill="#18120c"/>
    <circle cx="715" cy="172" r="3" fill="#18120c"/>
    <circle cx="755" cy="172" r="3" fill="#18120c"/>
    <circle cx="795" cy="172" r="3" fill="#18120c"/>
    <rect x="640" y="170" width="190" height="150" rx="10" fill="#e9eef2" stroke="#18120c" stroke-width="1.5"/>
    <line x1="652" y1="192" x2="718" y2="192" stroke="#b08d46" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="600" y="372" font-size="13.5" font-weight="600" fill="#18120c">Carry format</text>
    <text x="600" y="398" font-size="11" fill="#6b6258"><tspan x="600" dy="0">Retail kit with handles</tspan></text>
    <text x="600" y="448" font-size="10.5" font-style="italic" fill="#6b6258">Confirm on the sample:</text>
    <text x="600" y="468" font-size="11" fill="#18120c"><tspan x="600" dy="0">Handle attachment and</tspan><tspan x="600" dy="16">intended loaded weight</tspan></text>

    <!-- cell 4: divided kit -->
    <rect x="911" y="120" width="190" height="200" rx="10" fill="#e9eef2" stroke="#18120c" stroke-width="1.5"/>
    <line x1="923" y1="142" x2="1089" y2="142" stroke="#b08d46" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="1085" cy="142" r="6" fill="none" stroke="#b08d46" stroke-width="2"/>
    <line x1="1006" y1="160" x2="1006" y2="300" stroke="#18120c" stroke-width="1.25"/>
    <line x1="1006" y1="228" x2="1090" y2="228" stroke="#18120c" stroke-width="1.25"/>
    <text x="876" y="372" font-size="13.5" font-weight="600" fill="#18120c">Divided kit</text>
    <text x="876" y="398" font-size="11" fill="#6b6258"><tspan x="876" dy="0">Tools or items needing</tspan><tspan x="876" dy="16">separation</tspan></text>
    <text x="876" y="448" font-size="10.5" font-style="italic" fill="#6b6258">Confirm on the sample:</text>
    <text x="876" y="468" font-size="11" fill="#18120c"><tspan x="876" dy="0">Compartment access</tspan><tspan x="876" dy="16">and surface contact</tspan></text>
  </g>

  <line x1="48" y1="580" x2="1152" y2="580" stroke="#d8d2c8" stroke-width="1"/>
  <text x="48" y="612" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">No universal film band or airport-approval guarantee — agree material, thickness, finish and construction on the sample and in the quotation</text>
</svg>
