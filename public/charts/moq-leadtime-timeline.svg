<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">The calendar that matters: from enquiry to dispatch</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">Production windows are counted after sample approval and payment receipt — not from first contact</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><line x1="180" y1="560" x2="2260" y2="560" stroke="#28251f" stroke-width="6"/><circle cx="240" cy="560" r="22" fill="#aa8438"/><text x="240" y="480" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">ENQUIRY</text><text x="240" y="640" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">answered within 2 business hours</text><circle cx="700" cy="560" r="22" fill="#aa8438"/><text x="700" y="480" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">CUSTOM SAMPLE</text><text x="700" y="640" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">USD 25 + USD 20 shipping · 3–5 days</text><circle cx="1250" cy="560" r="22" fill="#28251f"/><text x="1250" y="480" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">APPROVAL + PAYMENT</text><text x="1250" y="640" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">the clock starts here</text><circle cx="1770" cy="560" r="22" fill="#aa8438"/><text x="1770" y="480" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">PRODUCTION</text><text x="1770" y="640" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">15–20 days @ 200–20,000 pcs</text><text x="1770" y="678" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">30–35 days @ 20,000–50,000 pcs</text><circle cx="2210" cy="560" r="22" fill="#aa8438"/><text x="2210" y="480" font-size="30" font-weight="700" fill="#28251f" font-family="Arial" text-anchor="middle">OUTBOUND SHIPPING</text><text x="2210" y="640" font-size="25" fill="#6f675a" font-family="Arial" text-anchor="middle">confirm per order</text><rect x="1250" y="520" width="520" height="80" fill="none" stroke="#28251f" stroke-width="0"/><text x="1510" y="400" font-size="28" fill="#28251f" font-family="Arial" text-anchor="middle">lead time anchors on this milestone</text><rect x="180" y="900" width="2040" height="230" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="208" y="952" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Two honest caveats</text><text x="208" y="1000" font-size="28" fill="#28251f" font-family="Arial">The two bands are volume tiers, not a sliding scale — a 25,000-piece order quotes in the</text><text x="208" y="1044" font-size="28" fill="#28251f" font-family="Arial">30–35 day band. Rush feasibility is answered per order, never a published promise; for</text><text x="208" y="1088" font-size="28" fill="#28251f" font-family="Arial">complete sets the MOQ is 200 pieces per component, not 200 sets.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>