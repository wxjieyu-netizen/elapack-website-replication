<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#F8F8F8"/><text x="480" y="70" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="600" fill="#3d3d3d" text-anchor="middle">What a packaging quote includes beyond the unit price</text><rect x="330" y="100" width="300" height="58" rx="29" fill="#A3B18A"/><text x="480" y="137" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Unit price — per piece</text><rect x="60" y="200" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="60" y="200" width="264" height="6" rx="3" fill="#A3B18A"/><text x="80" y="246" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Tooling &amp; dies</text><text x="80" y="274" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">Plates and cutting dies, once</text><text x="80" y="294" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">per design</text><rect x="348" y="200" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="348" y="200" width="264" height="6" rx="3" fill="#A3B18A"/><text x="368" y="246" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Sampling</text><text x="368" y="274" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">Charged per round; credited or</text><text x="368" y="294" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">not?</text><rect x="636" y="200" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="636" y="200" width="264" height="6" rx="3" fill="#A3B18A"/><text x="656" y="246" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Freight &amp; duties</text><text x="656" y="274" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">EXW, FOB or DDP — who pays</text><text x="656" y="294" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">what</text><rect x="60" y="342" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="60" y="342" width="264" height="6" rx="3" fill="#A3B18A"/><text x="80" y="388" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Specification changes</text><text x="80" y="416" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">A change after approval</text><text x="80" y="436" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">re-prices the job</text><rect x="348" y="342" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="348" y="342" width="264" height="6" rx="3" fill="#A3B18A"/><text x="368" y="388" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Storage &amp; split shipments</text><text x="368" y="416" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">Finished goods and</text><text x="368" y="436" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">part-deliveries</text><rect x="636" y="342" width="264" height="118" rx="10" fill="#ffffff" stroke="#d9d9d9"/><rect x="636" y="342" width="264" height="6" rx="3" fill="#A3B18A"/><text x="656" y="388" font-family="Montserrat, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#3d3d3d">Rework risk</text><text x="656" y="416" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">Who pays when a lot fails</text><text x="656" y="436" font-family="Montserrat, Arial, sans-serif" font-size="13.5" fill="#808080">inspection</text><text x="480" y="510" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#808080" text-anchor="middle">Every component is quotable in writing before production — the unit price alone is not the order cost.</text></svg>