<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Gift card formats compared: sleeve, envelope, holder and box constructions around the credit-card standard">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(48 28) scale(1.45)">
    <text x="24" y="34" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">Four formats, one card standard</text>
    <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Every style fits 3-3/8 × 2-1/8 in — the credit-card size — the opening moment is the choice</text>
    <g font-family="Helvetica,Arial,sans-serif">
      <!-- sleeve -->
      <rect x="40" y="88" width="130" height="84" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <rect x="52" y="104" width="74" height="46" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <path d="M 170 88 l 26 14 v 56 l -26 14 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <text x="40" y="196" font-size="13" fill="#18120c">Sleeve</text>
      <text x="40" y="213" font-size="11" fill="#6b6258">slim retail, mailers</text>

      <!-- envelope -->
      <path d="M 240 88 h 140 v 84 h -140 l 70 -42 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 240 88 l 70 42 l 70 -42 z" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <circle cx="310" cy="146" r="4" fill="#b08d46"/>
      <text x="240" y="196" font-size="13" fill="#18120c">Envelope</text>
      <text x="240" y="213" font-size="11" fill="#6b6258">flat gifting, post</text>

      <!-- holder / pop-up -->
      <rect x="440" y="96" width="120" height="76" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <rect x="452" y="66" width="96" height="34" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
      <line x1="470" y1="96" x2="470" y2="80" stroke="#18120c" stroke-width="1.2"/>
      <line x1="530" y1="96" x2="530" y2="80" stroke="#18120c" stroke-width="1.2"/>
      <text x="440" y="196" font-size="13" fill="#18120c">Holder / pop-up</text>
      <text x="440" y="213" font-size="11" fill="#6b6258">the card lifts as it opens</text>

      <!-- box -->
      <rect x="620" y="110" width="150" height="62" fill="#e5d5b8" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 620 110 l 24 -22 h 150 l -24 22 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <path d="M 746 110 l 24 -22 v 62 l -24 22 z" fill="#f2e9dc" stroke="#18120c" stroke-width="1.5"/>
      <text x="620" y="196" font-size="13" fill="#18120c">Box</text>
      <text x="620" y="213" font-size="11" fill="#6b6258">lid-and-base, ribbon-tie, slider</text>
    </g>
    <text x="24" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">Sleeve, envelope, holder and box are separate line items in one brief — bought in different quantities and materials.</text>
    <text x="24" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b6258">Card size = ISO/IEC 7810 ID-1; formats after published US supplier stock ranges, quoted for orientation.</text>
  </g>
</svg>
