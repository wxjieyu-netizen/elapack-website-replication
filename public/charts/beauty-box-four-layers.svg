<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The four layers of a beauty box, decided together">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">The four layers of a beauty box, decided together</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Hero, support, protection and brand — a month feels generic when only the first layer changes</text>
<circle cx="88" cy="186.0" r="20" fill="#18120c"/><text x="88" y="191.0" text-anchor="middle" font-size="15" fill="#faf9f7">1</text><rect x="130" y="140" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Hero layer</text><text x="635.0" y="192" text-anchor="middle" font-size="11.5" fill="#6b6258">the anchor item the month is built around — sized and weighted first</text><circle cx="88" cy="296.0" r="20" fill="#18120c"/><text x="88" y="301.0" text-anchor="middle" font-size="15" fill="#faf9f7">2</text><rect x="130" y="250" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Support layer</text><text x="635.0" y="302" text-anchor="middle" font-size="11.5" fill="#6b6258">the two to four items that ride along; their formats drive the insert</text><circle cx="88" cy="406.0" r="20" fill="#18120c"/><text x="88" y="411.0" text-anchor="middle" font-size="15" fill="#faf9f7">3</text><rect x="130" y="360" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Protection layer</text><text x="635.0" y="412" text-anchor="middle" font-size="11.5" fill="#6b6258">pouches, dividers and wrap that keep formats from colliding</text><circle cx="88" cy="516.0" r="20" fill="#18120c"/><text x="88" y="521.0" text-anchor="middle" font-size="15" fill="#faf9f7">4</text><rect x="130" y="470" width="1010" height="92" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="635.0" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Brand layer</text><text x="635.0" y="522" text-anchor="middle" font-size="11.5" fill="#6b6258">card, print faces and closure — the layer that reads on camera</text></g>
</svg>
