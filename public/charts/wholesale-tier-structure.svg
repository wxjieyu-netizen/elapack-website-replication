<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Wholesale tier structure: unit price steps down across quantity bands, with MOQ, cutting-die and sample anchors">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g transform="translate(60 28) scale(1.45)" font-family="Helvetica,Arial,sans-serif">
    <text x="24" y="22" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#18120c">The tier ladder a wholesale buyer reads</text>
    <text x="24" y="40" font-size="11" fill="#6b6258">Unit price falls stepwise with quantity — the quote structure moves the price, not the negotiation</text>

    <text x="24" y="66" font-size="10.5" fill="#6b6258">unit price</text>
    <text x="696" y="226" text-anchor="end" font-size="10.5" fill="#6b6258">quantity →</text>

    <line x1="24" y1="240" x2="696" y2="240" stroke="#b08d46" stroke-width="1.5"/>
    <rect x="24" y="80" width="216" height="160" fill="#18120c"/>
    <rect x="252" y="124" width="216" height="116" fill="#3d3227"/>
    <rect x="480" y="168" width="216" height="72" fill="#6b6258"/>
    <g font-size="13" fill="#faf9f7">
      <text x="132" y="142" text-anchor="middle">200 – 1,000</text>
      <text x="132" y="160" text-anchor="middle" fill="#b08d46" font-size="11">first branded run</text>
      <text x="360" y="170" text-anchor="middle">1,000 – 20,000</text>
      <text x="360" y="188" text-anchor="middle" fill="#b08d46" font-size="11">core replenishment</text>
      <text x="588" y="196" text-anchor="middle">20,000 – 50,000</text>
      <text x="588" y="212" text-anchor="middle" fill="#d8cba9" font-size="11">retail programs</text>
    </g>
    <g font-size="11" fill="#6b6258">
      <text x="132" y="258" text-anchor="middle">15–20 days</text>
      <text x="360" y="258" text-anchor="middle">15–20 days</text>
      <text x="588" y="258" text-anchor="middle">20–25 days</text>
    </g>

    <g font-size="12.5" fill="#18120c">
      <rect x="24" y="292" width="216" height="66" rx="6" fill="none" stroke="#b08d46"/>
      <text x="132" y="318" text-anchor="middle" font-weight="600">MOQ 200 pcs per design</text>
      <text x="132" y="338" text-anchor="middle" font-size="11" fill="#6b6258">every category, sizes included</text>

      <rect x="252" y="292" width="216" height="66" rx="6" fill="none" stroke="#b08d46"/>
      <text x="360" y="318" text-anchor="middle" font-weight="600">Cutting die USD 50–100</text>
      <text x="360" y="338" text-anchor="middle" font-size="11" fill="#6b6258">one-off per design — reorders never re-pay it</text>

      <rect x="480" y="292" width="216" height="66" rx="6" fill="none" stroke="#b08d46"/>
      <text x="588" y="318" text-anchor="middle" font-weight="600">Sample round USD 25 + 20</text>
      <text x="588" y="338" text-anchor="middle" font-size="11" fill="#6b6258">stock sample free, ships 2–3 days</text>
    </g>

    <text x="24" y="396" font-size="11" fill="#6b6258">Ask for tiered unit prices at 200 / 1,000 / 5,000 on one quote, same dieline — reorders then re-quote themselves.</text>
    <text x="24" y="414" font-size="11" fill="#6b6258">Board grade, wrap and magnet count belong on the same tier quote; freight steps with volume and pack format.</text>
  </g>
</svg>
