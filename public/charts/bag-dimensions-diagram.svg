<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aa8438"/></marker></defs><rect width="2400" height="1350" fill="#faf8f4"/><text x="100" y="110" font-size="52" font-weight="700" fill="#28251f" font-family="Arial">Shopping bag dimensions: the four numbers a factory quotes from</text><text x="100" y="168" font-size="30" fill="#6f675a" font-family="Arial">State finished width, height, gusset depth and units — plus handle length and attachment</text><line x1="100" y1="200" x2="2300" y2="200" stroke="#d8d2c6" stroke-width="3"/><rect x="520" y="360" width="700" height="620" fill="#f1ece2" stroke="#28251f" stroke-width="5"/><rect x="1260" y="360" width="120" height="620" fill="white" stroke="#28251f" stroke-width="5"/><text x="1320" y="330" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">gusset (side fold)</text><path d="M 660 360 C 660 220, 880 220, 880 360" fill="none" stroke="#28251f" stroke-width="10"/><path d="M 900 360 C 900 220, 1080 220, 1080 360" fill="none" stroke="#28251f" stroke-width="10"/><circle cx="660" cy="360" r="14" fill="#aa8438"/><circle cx="880" cy="360" r="14" fill="#aa8438"/><circle cx="900" cy="360" r="14" fill="#aa8438"/><circle cx="1080" cy="360" r="14" fill="#aa8438"/><line x1="520" y1="1050" x2="1220" y2="1050" stroke="#aa8438" stroke-width="3"/><line x1="520" y1="1050" x2="520.0" y2="1064.0" stroke="#aa8438" stroke-width="3"/><line x1="1220" y1="1050" x2="1220.0" y2="1064.0" stroke="#aa8438" stroke-width="3"/><text x="870.0" y="1088.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">WIDTH</text><line x1="440" y1="360" x2="440" y2="980" stroke="#aa8438" stroke-width="3"/><line x1="440" y1="360" x2="426.0" y2="360.0" stroke="#aa8438" stroke-width="3"/><line x1="440" y1="980" x2="426.0" y2="980.0" stroke="#aa8438" stroke-width="3"/><text x="480.0" y="658.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="start">HEIGHT</text><line x1="1260" y1="1050" x2="1380" y2="1050" stroke="#aa8438" stroke-width="3"/><line x1="1260" y1="1050" x2="1260.0" y2="1064.0" stroke="#aa8438" stroke-width="3"/><line x1="1380" y1="1050" x2="1380.0" y2="1064.0" stroke="#aa8438" stroke-width="3"/><text x="1320.0" y="1088.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">GUSSET</text><line x1="660" y1="170" x2="1080" y2="170" stroke="#aa8438" stroke-width="3"/><line x1="660" y1="170" x2="660.0" y2="184.0" stroke="#aa8438" stroke-width="3"/><line x1="1080" y1="170" x2="1080.0" y2="184.0" stroke="#aa8438" stroke-width="3"/><text x="870.0" y="128.0" font-size="30" font-weight="700" fill="#aa8438" font-family="Arial" text-anchor="middle">HANDLE LENGTH + DROP</text><text x="870" y="670" font-size="30" fill="#6f675a" font-family="Arial" text-anchor="middle">carried weight</text><text x="870" y="714" font-size="26" fill="#6f675a" font-family="Arial" text-anchor="middle">specify with the dimensions</text><rect x="1560" y="300" width="760" height="420" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1588" y="352" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Gift-box clearance</text><text x="1588" y="400" font-size="28" fill="#28251f" font-family="Arial">For a bag that carries a gift box, check</text><text x="1588" y="444" font-size="28" fill="#28251f" font-family="Arial">clearance with the finished box plus any</text><text x="1588" y="488" font-size="28" fill="#28251f" font-family="Arial">tissue or components — do not size to the</text><text x="1588" y="532" font-size="28" fill="#28251f" font-family="Arial">box alone.</text><rect x="1560" y="760" width="760" height="340" rx="14" fill="#f1ece2" stroke="#aa8438" stroke-width="2"/><text x="1588" y="812" font-size="32" font-weight="700" fill="#aa8438" font-family="Arial">Handles</text><text x="1588" y="860" font-size="28" fill="#28251f" font-family="Arial">Specify handle material, length,</text><text x="1588" y="904" font-size="28" fill="#28251f" font-family="Arial">attachment and reinforcement. Comfort and</text><text x="1588" y="948" font-size="28" fill="#28251f" font-family="Arial">base performance are judged with the real</text><text x="1588" y="992" font-size="28" fill="#28251f" font-family="Arial">load, not from paper GSM.</text><line x1="100" y1="1215" x2="2300" y2="1215" stroke="#d8d2c6" stroke-width="3"/><text x="100" y="1265" font-size="24" fill="#6f675a" font-family="Arial">Sources: ELAPACK ordering guides, 2026 · Illustrative diagrams — confirm specifications on a physical sample before production.</text></svg>