<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="Arial, Helvetica, sans-serif">
  <rect width="2400" height="1350" fill="#faf8f4"/>
  <text x="100" y="110" font-size="52" font-weight="bold" fill="#28251f">Magnetic closure anatomy: where the spec actually lives</text>
  <text x="100" y="165" font-size="30" fill="#6b6357">Construction format, closure hardware and board weight are three separate decisions.</text>

  <!-- LEFT: assembled flip-top -->
  <text x="200" y="270" font-size="34" font-weight="bold" fill="#28251f">ASSEMBLED FLIP-TOP</text>
  <rect x="200" y="310" width="500" height="500" fill="#ffffff" stroke="#28251f" stroke-width="5"/>
  <line x1="200" y1="460" x2="700" y2="460" stroke="#28251f" stroke-width="4" stroke-dasharray="14 10"/>
  <rect x="270" y="440" width="36" height="40" fill="#aa8438"/>
  <rect x="270" y="480" width="36" height="20" fill="#aa8438" opacity="0.35"/>
  <rect x="432" y="440" width="40" height="32" fill="#aa8438"/>
  <rect x="432" y="472" width="40" height="20" fill="#aa8438" opacity="0.35"/>
  <rect x="598" y="440" width="36" height="40" fill="#aa8438"/>
  <rect x="598" y="480" width="36" height="20" fill="#aa8438" opacity="0.35"/>

  <!-- callouts below, two spaced columns -->
  <line x1="290" y1="500" x2="290" y2="880" stroke="#aa8438" stroke-width="4"/>
  <text x="200" y="925" font-size="29" font-weight="bold" fill="#28251f">Magnet pairs</text>
  <text x="200" y="963" font-size="29" fill="#28251f">Count, position and strength are</text>
  <text x="200" y="999" font-size="29" fill="#28251f">confirmed per design on the sample.</text>

  <polyline points="452,504 452,840 760,840" fill="none" stroke="#aa8438" stroke-width="4"/>
  <text x="780" y="895" font-size="29" font-weight="bold" fill="#28251f">Closing face</text>
  <text x="780" y="933" font-size="29" fill="#28251f">Alignment, retention and opening</text>
  <text x="780" y="969" font-size="29" fill="#28251f">feel are judged on the loaded sample.</text>

  <!-- RIGHT: collapsible -->
  <text x="1350" y="270" font-size="34" font-weight="bold" fill="#28251f">COLLAPSIBLE (SHIPS FLAT)</text>
  <rect x="1400" y="330" width="440" height="80" fill="#ffffff" stroke="#28251f" stroke-width="5"/>
  <rect x="1400" y="410" width="440" height="40" fill="#f0e6d6" stroke="#28251f" stroke-width="5"/>
  <rect x="1400" y="450" width="440" height="40" fill="#ffffff" stroke="#28251f" stroke-width="5"/>

  <text x="1350" y="590" font-size="29" font-weight="bold" fill="#28251f">Ships flat</text>
  <text x="1350" y="628" font-size="29" fill="#28251f">Freight and storage shrink;</text>
  <text x="1350" y="664" font-size="29" fill="#28251f">assembly labour moves to the</text>
  <text x="1350" y="700" font-size="29" fill="#28251f">receiving team.</text>

  <!-- wall board detail -->
  <rect x="1960" y="360" width="240" height="26" fill="#28251f"/>
  <rect x="1960" y="386" width="240" height="26" fill="#e7dccb"/>
  <rect x="1960" y="412" width="240" height="26" fill="#28251f"/>
  <text x="1960" y="510" font-size="29" font-weight="bold" fill="#28251f">Wall = greyboard</text>
  <text x="1960" y="548" font-size="29" fill="#28251f">Quoted in caliper (mm),</text>
  <text x="1960" y="584" font-size="29" fill="#28251f">not grammage alone.</text>

  <!-- trade-off band -->
  <rect x="1350" y="780" width="950" height="250" fill="#f0e6d6" stroke="#aa8438" stroke-width="3"/>
  <text x="1400" y="845" font-size="30" font-weight="bold" fill="#28251f">The format trade-off</text>
  <text x="1400" y="895" font-size="29" fill="#28251f">Assembled: ready to pack, bulky to ship.</text>
  <text x="1400" y="933" font-size="29" fill="#28251f">Collapsible: flat freight, assembly on receipt.</text>
  <text x="1400" y="985" font-size="29" fill="#28251f">Neither format changes the closure spec — magnets</text>
  <text x="1400" y="1021" font-size="29" fill="#28251f">are confirmed on the loaded sample.</text>

  <line x1="100" y1="1150" x2="2300" y2="1150" stroke="#d8cfc0" stroke-width="3"/>
  <text x="100" y="1210" font-size="28" fill="#28251f">Ordering baseline: MOQ 200 pieces · custom sample USD 30 + USD 25 shipping, 3–5 days · production typically 15–20 working days from sample approval and payment.</text>
  <text x="100" y="1290" font-size="26" fill="#6b6357">Sources: Yucai Printing greyboard construction; ELAPACK confirmed terms. Illustrative diagram — not to scale.</text>
</svg>
