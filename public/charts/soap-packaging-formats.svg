<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Chart comparing five soap packaging formats by protection level and relative cost position">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#18120c">Soap packaging formats: protection vs cost</text>
  <text x="760" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b08d46" text-anchor="middle" font-weight="bold">Cost position</text>
  <rect x="120" y="125" width="300" height="60" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="140" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Rigid two-piece</text>
  <text x="520" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">protection: High</text>
  <rect x="700" y="147" width="240" height="16" fill="#b08d46"/>
  <rect x="120" y="203" width="300" height="60" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="140" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Folding carton</text>
  <text x="520" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">protection: Medium</text>
  <rect x="700" y="225" width="150" height="16" fill="#b08d46"/>
  <rect x="120" y="281" width="300" height="60" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="140" y="316" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Kraft sleeve</text>
  <text x="520" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">protection: Light bars</text>
  <rect x="700" y="303" width="90" height="16" fill="#b08d46"/>
  <rect x="120" y="359" width="300" height="60" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="140" y="394" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Wrapper paper</text>
  <text x="520" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">protection: Display only</text>
  <rect x="700" y="381" width="30" height="16" fill="#b08d46"/>
  <rect x="120" y="437" width="300" height="60" fill="#f2e9dc" stroke="#b08d46" stroke-width="1.5"/>
  <text x="140" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#18120c" text-anchor="start" font-weight="bold">Band</text>
  <text x="520" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="start" font-weight="normal">protection: Bare-bar retail</text>
  <rect x="700" y="459" width="30" height="16" fill="#b08d46"/>
  <text x="600" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b6258" text-anchor="middle" font-weight="normal">The fragility of the bar and the shelf it is headed for pick the format — branding prints onto whichever carries.</text>
</svg>
