<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Wrapping paper sheet sizes compared: 50 by 70 cm and 100 by 100 cm factory formats against 20x29, 24x36 and 27x39 inch US configurator sheets, drawn to scale">
  <rect width="1200" height="675" fill="#faf9f7"/>
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="60" y="64" font-family="Georgia,serif" font-size="26" font-weight="600" fill="#18120c">Sheet formats, drawn to scale</text>
    <text x="60" y="90" font-size="14" fill="#6b6258">US configurators top out at 27×39″ — factory sheet programmes reach 100×100 cm (39.4″ square)</text>

    <!-- scale: 1 inch = 4.6 px. Sheets drawn as portrait rectangles (width x height) -->
    <!-- 20x29 -->
    <g transform="translate(80 150)">
      <rect x="0" y="0" width="92" height="133" fill="none" stroke="#8a7d6d" stroke-width="2"/>
      <text x="46" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">20×29″</text>
      <text x="46" y="172" text-anchor="middle" font-size="11.5" fill="#6b6258">StationeryHQ</text>
      <text x="46" y="188" text-anchor="middle" font-size="11.5" fill="#6b6258">boxed gifts</text>
    </g>
    <!-- 24x36 -->
    <g transform="translate(250 150)">
      <rect x="0" y="0" width="110" height="166" fill="none" stroke="#8a7d6d" stroke-width="2"/>
      <text x="55" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">24×36″</text>
      <text x="55" y="205" text-anchor="middle" font-size="11.5" fill="#6b6258">Packlane</text>
      <text x="55" y="221" text-anchor="middle" font-size="11.5" fill="#6b6258">boxed gifts</text>
    </g>
    <!-- 27x39 -->
    <g transform="translate(440 150)">
      <rect x="0" y="0" width="124" height="179" fill="none" stroke="#8a7d6d" stroke-width="2"/>
      <text x="62" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">27×39″</text>
      <text x="62" y="218" text-anchor="middle" font-size="11.5" fill="#6b6258">US configurator</text>
      <text x="62" y="234" text-anchor="middle" font-size="11.5" fill="#6b6258">ceiling</text>
    </g>
    <!-- 50x70cm = 19.7x27.6in -->
    <g transform="translate(660 150)">
      <rect x="0" y="0" width="91" height="127" fill="#241c12"/>
      <text x="46" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">50×70 cm</text>
      <text x="46" y="166" text-anchor="middle" font-size="11.5" fill="#b08d46">(19.7×27.6″) factory</text>
      <text x="46" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">the workhorse</text>
    </g>
    <!-- 100x100cm = 39.4in square -->
    <g transform="translate(830 150)">
      <rect x="0" y="0" width="181" height="181" fill="#b08d46"/>
      <text x="90" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#18120c">100×100 cm</text>
      <text x="90" y="220" text-anchor="middle" font-size="11.5" fill="#6b6258">(39.4″ square) factory —</text>
      <text x="90" y="236" text-anchor="middle" font-size="11.5" fill="#6b6258">hampers and odd shapes, no seam</text>
    </g>

    <!-- scale bar -->
    <g transform="translate(80 470)">
      <line x1="0" y1="0" x2="46" y2="0" stroke="#18120c" stroke-width="2"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#18120c" stroke-width="2"/>
      <line x1="46" y1="-5" x2="46" y2="5" stroke="#18120c" stroke-width="2"/>
      <text x="23" y="20" text-anchor="middle" font-size="11" fill="#6b6258">10 inches</text>
    </g>

    <!-- bottom rules -->
    <g transform="translate(80 530)" font-size="12.5" fill="#6b6258">
      <text x="0" y="0">Size from the product: “measure the largest item you wrap, add enough to cover both ends, and pick the width from there” (4over4).</text>
      <text x="0" y="22">“Rolls waste less on large or awkward items, sheets waste less on small items” — a roll suits a counter wrapping many shapes, a sheet suits a boxed line.</text>
      <text x="0" y="44">Factory programme: two formats, 50×70 cm and 100×100 cm, from 500 sheets per design, produced in 10–15 days.</text>
    </g>
  </g>
</svg>
