<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cross-section of a drawer box showing the outer sleeve and sliding inner tray in three fit states: too tight with binding and torn wrap, correct with free travel and no rattle, and too loose with tray movement and product scuffing">
  <rect width="1200" height="675" fill="#faf9f7"/>

  <text x="48" y="52" font-family="Georgia,serif" font-size="27" font-weight="600" fill="#18120c">One gap decides the feel</text>
  <text x="48" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b6258">Sleeve-to-tray clearance in section · three states a buyer should be able to name before approving a sample</text>

  <line x1="48" y1="98" x2="1152" y2="98" stroke="#b08d46" stroke-width="1.5"/>

  <!-- ===== State 1: too tight ===== -->
  <text x="48" y="132" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#a03b2c">1 · TOO TIGHT</text>
  <text x="48" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">binding · wrap tears at the mouth</text>

  <g transform="translate(48 168)">
    <!-- sleeve -->
    <rect x="0" y="0" width="330" height="96" fill="none" stroke="#18120c" stroke-width="6"/>
    <!-- tray much the same size, touching -->
    <rect x="6" y="6" width="318" height="84" fill="#e8e2d6" stroke="#8d857a" stroke-width="2"/>
    <!-- product -->
    <rect x="34" y="34" width="90" height="28" fill="#b08d46"/>
    <!-- contact marks -->
    <line x1="6" y1="0" x2="6" y2="96" stroke="#a03b2c" stroke-width="3" stroke-dasharray="5 4"/>
    <line x1="324" y1="0" x2="324" y2="96" stroke="#a03b2c" stroke-width="3" stroke-dasharray="5 4"/>
    <!-- pull arrow with resistance -->
    <line x1="330" y1="48" x2="382" y2="48" stroke="#a03b2c" stroke-width="3"/>
    <polygon points="382,48 370,42 370,54" fill="#a03b2c"/>
    <text x="392" y="45" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a03b2c">jams</text>
    <text x="392" y="61" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">customer pulls</text>
    <text x="392" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">harder, wrap splits</text>
  </g>

  <!-- ===== State 2: correct ===== -->
  <text x="48" y="322" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#18120c">2 · CORRECT</text>
  <text x="48" y="342" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">free travel · product held · no rattle</text>

  <g transform="translate(48 358)">
    <rect x="0" y="0" width="330" height="96" fill="none" stroke="#18120c" stroke-width="6"/>
    <!-- tray inset with visible gap -->
    <rect x="18" y="18" width="294" height="60" fill="#e8e2d6" stroke="#8d857a" stroke-width="2"/>
    <!-- gap callouts -->
    <line x1="6" y1="12" x2="6" y2="84" stroke="#b08d46" stroke-width="2"/>
    <text x="12" y="10" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#b08d46">0.5–1.0 mm gap</text>
    <!-- product -->
    <rect x="42" y="34" width="90" height="28" fill="#b08d46"/>
    <line x1="330" y1="48" x2="382" y2="48" stroke="#18120c" stroke-width="3"/>
    <polygon points="382,48 370,42 370,54" fill="#18120c"/>
    <text x="392" y="45" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#18120c">glides</text>
    <text x="392" y="61" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">deliberate</text>
    <text x="392" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">resistance</text>
  </g>

  <!-- ===== State 3: too loose ===== -->
  <text x="48" y="512" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8a6a1f">3 · TOO LOOSE</text>
  <text x="48" y="532" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">tray shifts · product scuffs in transit</text>

  <g transform="translate(48 548)">
    <rect x="0" y="0" width="330" height="96" fill="none" stroke="#18120c" stroke-width="6"/>
    <rect x="30" y="28" width="270" height="40" fill="#e8e2d6" stroke="#8d857a" stroke-width="2"/>
    <!-- movement arrows -->
    <line x1="20" y1="48" x2="8" y2="48" stroke="#8a6a1f" stroke-width="2"/>
    <polygon points="8,48 16,43 16,53" fill="#8a6a1f"/>
    <line x1="310" y1="48" x2="322" y2="48" stroke="#8a6a1f" stroke-width="2"/>
    <polygon points="322,48 314,43 314,53" fill="#8a6a1f"/>
    <!-- product tilted -->
    <g transform="rotate(-6 130 48)">
      <rect x="85" y="34" width="90" height="28" fill="#b08d46"/>
    </g>
    <text x="392" y="45" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a6a1f">slips</text>
    <text x="392" y="61" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">fine scuffs on</text>
    <text x="392" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">plated surfaces</text>
  </g>

  <!-- footnote -->
  <line x1="48" y1="654" x2="1152" y2="654" stroke="#d8d2c8" stroke-width="1"/>
  <text x="48" y="672" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#6b6258">Gap values as published by named suppliers (see guide): factory control ±0.5 mm; humidity allowance 0.5–1.0 mm; general rigid-box tolerance ±1–3 mm. Diagram is schematic, not to scale.</text>

  <text x="960" y="132" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Outer sleeve</text>
  <line x1="955" y1="136" x2="900" y2="150" stroke="#6b6258" stroke-width="1"/>
  <text x="960" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b6258">Inner tray</text>
  <line x1="955" y1="304" x2="900" y2="392" stroke="#6b6258" stroke-width="1"/>
</svg>
