<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Box and insert are one matched specification">
<rect width="1200" height="675" fill="#faf9f7"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="60" y="52" font-family="Georgia,serif" font-size="24" font-weight="600" fill="#18120c">Box and insert are one matched specification</text>
<text x="60" y="78" font-size="13" fill="#6b6258">Two numbers every ring-box brief must carry as a pair — quoting the outer box alone leaves the fit undefined</text>
<rect x="120" y="130" width="420" height="240" rx="6" fill="#18120c"/><text x="330.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#faf9f7">Outer box</text><text x="330.0" y="182" text-anchor="middle" font-size="11.5" fill="#b08d46">external L×W×H, board grade,</text><text x="330.0" y="199" text-anchor="middle" font-size="11.5" fill="#b08d46">lid style, finish</text><rect x="660" y="130" width="420" height="240" rx="6" fill="none" stroke="#b08d46" stroke-width="1.5"/><text x="870.0" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#18120c">Insert slot spec</text><text x="870.0" y="182" text-anchor="middle" font-size="11.5" fill="#6b6258">slot width and depth, clearance</text><text x="870.0" y="199" text-anchor="middle" font-size="11.5" fill="#6b6258">above the setting, foam or</text><text x="870.0" y="216" text-anchor="middle" font-size="11.5" fill="#6b6258">EPE density, covering fabric</text><line x1="548" y1="250.0" x2="646" y2="250.0" stroke="#b08d46" stroke-width="1.5"/><path d="M652 250.0 l-9 -5 v10 z" fill="#b08d46"/><text x="60" y="640" font-size="11.5" fill="#6b6258">A box that is right and an insert that is right still miss if they are specified separately — match them in one line.</text>
</g>
</svg>
